# The create-chapter-regions dialog: a modal dialog named for itself, with the two
# credits-track selects, the Move-an-existing-region checkbox above a named table of the planned regions, a "Not planned"
# region listing the chapters still missing a track link, one line per reason (matched partially), and Create N regions.
# The page behind it is aria-hidden.
- /children: equal
# The two toast live regions stay in the tree on purpose (see dialog-mark-composer.aria.yml); empty here.
- main
- status
- alert
- status
- alert
- status
- dialog "Create chapter regions":
  - heading "Create chapter regions" [level=2]
  - button "Close"
  - paragraph: /Plan one REAPER region per chapter with a confirmed track link/
  - text: Opening credits track
  - combobox "Opening credits track":
    - option "None"
    - option "Chapter 2" [selected]
  - text: Closing credits track
  - combobox "Closing credits track":
    - option "None" [selected]
  - checkbox "Move an existing region that shares a chapter’s title, instead of adding a second one"
  - table "Chapter regions":
    - rowgroup:
      - row "Region Track Start End Status"
    - rowgroup:
      - row /^Opening credits Chapter 2/:
        - cell "New region"
      - row /^Chapter 1 Chapter 1/:
        - cell "New region"
  - region /Not planned \(\d+\)/:
    - heading /Not planned \(\d+\)/ [level=3]
    - list:
      - listitem: /^No track is linked to this chapter\. Chapter 2, Chapter 3/
  - button "Cancel"
  - button "Create 2 regions"
