# Define marks (the Script page's "Define how you mark up"): a modal dialog with each mark type's name, its colour box (a button
# named with the colour, which opens the swatches) and line, and Done.
# The page behind it is aria-hidden; the live regions stay exposed (see dialog-mark-composer.aria.yml).
- /children: equal
- main:
  - region "Reader": /¶ 1 of \d+/
- status
- alert
- status
- dialog "Define how you mark up":
  - heading "Define how you mark up" [level=2]
  - button "Close"
  - list:
    - listitem:
      - textbox "Mark name": Word stress
      - 'button "Colour: Copper"'
      - combobox "Line":
        - option "Highlight" [selected]
        - option "Underline"
        - option "Double line"
        - option "Dotted"
        - option "Wavy"
        - option "Box"
      - checkbox "Asks"
      - text: Asks
      - button "Remove"
    - listitem:
      - textbox "Mark name": Breath / pause
      - 'button "Colour: Blue"'
      - combobox "Line":
        - option "Highlight"
        - option "Underline"
        - option "Double line"
        - option "Dotted" [selected]
        - option "Wavy"
        - option "Box"
      - checkbox "Asks"
      - text: Asks
      - button "Remove"
    - listitem:
      - textbox "Mark name": Pace
      - 'button "Colour: Green"'
      - combobox "Line":
        - option "Highlight"
        - option "Underline"
        - option "Double line"
        - option "Dotted"
        - option "Wavy" [selected]
        - option "Box"
      - checkbox "Asks"
      - text: Asks
      - button "Remove"
    - listitem:
      - textbox "Mark name": Emotion
      - 'button "Colour: Red"'
      - combobox "Line":
        - option "Highlight"
        - option "Underline" [selected]
        - option "Double line"
        - option "Dotted"
        - option "Wavy"
        - option "Box"
      - checkbox "Asks"
      - text: Asks
      - button "Remove"
    - listitem:
      - textbox "Mark name": Note
      - 'button "Colour: Violet"'
      - combobox "Line":
        - option "Highlight"
        - option "Underline"
        - option "Double line" [selected]
        - option "Dotted"
        - option "Wavy"
        - option "Box"
      - checkbox "Asks"
      - text: Asks
      - button "Remove"
    - listitem:
      - textbox "Mark name": Query for author
      - 'button "Colour: Amber"'
      - combobox "Line":
        - option "Highlight" [selected]
        - option "Underline"
        - option "Double line"
        - option "Dotted"
        - option "Wavy"
        - option "Box"
      - checkbox "Asks" [checked]
      - text: Asks
      - button "Remove"
  - button "Add a mark"
  - button "Done"