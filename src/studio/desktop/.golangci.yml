# golangci-lint v2 for the desktop app (Go module in this folder). Run through
# `nx run desktop:lint` (scripts/quality.mjs go-lint), which also runs gofmt and go vet.
#
# `standard` is the v2 default set: errcheck, govet, ineffassign, staticcheck (which in v2 also
# carries the former gosimple and stylecheck checks) and unused. gosec is added on top. This is
# equal to or stricter than the standalone staticcheck it replaced (docs/operations/verification-tooling.md).
#
# The version is pinned in scripts/toolchain.json; the binary is built with the repo's Go toolchain
# (`go install`), so it always understands the Go version the module targets.
version: "2"

issues:
  # Report everything. The defaults cap identical findings at 3 and each linter at 50, which would
  # hide how many of a kind exist and let a gate pass on a truncated list.
  max-issues-per-linter: 0
  max-same-issues: 0

linters:
  default: standard
  enable:
    - depguard
    - gosec
  settings:
    # Architecture rules taken from accepted or proposed ADRs, so they fail the build instead of relying on review.
    # Each `desc` says which rule it is and where it comes from.
    depguard:
      rules:
        no-network-outside-the-download-flow:
          # ADR 0002 (analysis is local; models are fetched only through the explicit first-use flow) and
          # docs/architecture/threat-model.md (the media route) and ADR 0002 (the app's own update). The only networking the host itself imports is the asset
          # download in internal/assets, the release check and update download in internal/update, and the track-audio route in the
          # root media.go. Tests may use httptest servers.
          # This is a fence on the Go host's imports, not proof that analysis is local: it does not see a sidecar's
          # own network use (the ephemeral uv environment of docs/architecture/manuscript-teleprompter.md#prototype-findings-and-live-engine-direction downloads packages), os/exec, or a
          # third-party client added under another name. `net` also covers its subpackages such as net/url and net/http.
          # The fourth allow row is the Merriam-Webster adapter alone: one narrator-
          # initiated word at a time, on the narrator's own key, to www.dictionaryapi.com only. Its parent package
          # (internal/pronunciationonline: the port, the cache, the key) stays denied.
          files: ["$all", "!$test", "!**/internal/assets/**", "!**/internal/update/**", "!**/src/studio/desktop/media.go", "!**/internal/pronunciationonline/merriamwebster/**"]
          deny:
            - pkg: net
              desc: "the Go host imports networking only in internal/assets (the first-use download flow), internal/update (the app's own update) and the root media.go (the track media route); see ADR 0002 and docs/architecture/threat-model.md"
            - pkg: crypto/tls
              desc: "the Go host imports networking only in internal/assets, internal/update and the root media.go; see ADR 0002"
            # golang.org/x/net's actual networking subpackages, denied individually rather than the whole module tree:
            # the module also holds non-networking packages (golang.org/x/net/html, the XHTML parser
            # internal/importer/epub_xhtml.go and epub_toc.go use to read EPUB content documents and its nav TOC,
            # recorded in docs/architecture/docx-import-quirks.md) that this rule was never meant to block - its
            # own desc names "networking", not "parsing". A denylist entry keyed to the whole tree pre-dated any
            # non-networking use of the module and was broader than its stated intent.
            - pkg: golang.org/x/net/http2
              desc: "the Go host imports networking only in internal/assets, internal/update and the root media.go; see ADR 0002"
            - pkg: golang.org/x/net/proxy
              desc: "the Go host imports networking only in internal/assets, internal/update and the root media.go; see ADR 0002"
            - pkg: golang.org/x/net/websocket
              desc: "the Go host imports networking only in internal/assets, internal/update and the root media.go; see ADR 0002"
            - pkg: golang.org/x/net/webdav
              desc: "the Go host imports networking only in internal/assets, internal/update and the root media.go; see ADR 0002"
            - pkg: golang.org/x/net/icmp
              desc: "the Go host imports networking only in internal/assets, internal/update and the root media.go; see ADR 0002"
            - pkg: golang.org/x/net/ipv4
              desc: "the Go host imports networking only in internal/assets, internal/update and the root media.go; see ADR 0002"
            - pkg: golang.org/x/net/ipv6
              desc: "the Go host imports networking only in internal/assets, internal/update and the root media.go; see ADR 0002"
            - pkg: golang.org/x/net/dns
              desc: "the Go host imports networking only in internal/assets, internal/update and the root media.go; see ADR 0002"
            - pkg: golang.org/x/net/nettest
              desc: "the Go host imports networking only in internal/assets, internal/update and the root media.go; see ADR 0002"
            - pkg: golang.org/x/net/netutil
              desc: "the Go host imports networking only in internal/assets, internal/update and the root media.go; see ADR 0002"
        analyzers-report-they-do-not-write:
          # ADR 0002: an analyzer's output is a finding; it does not edit audio or the manuscript, and the
          # REAPER adapter owns execution. The list extends that to what would let an analyzer act: the manuscript
          # store, the Story Bible, settings, the recents list, the REAPER bridge, the process supervisor and the
          # Transcript Compare service (which exports markers). It checks direct imports only.
          files: ["**/internal/measure/**", "**/internal/findings/**"]
          deny:
            - pkg: desktop/internal/manuscript
              desc: "analyzers report findings and do not touch the manuscript store"
            - pkg: desktop/internal/guide
              desc: "analyzers report findings and do not edit the Story Bible"
            - pkg: desktop/internal/settings
              desc: "analyzers report findings and do not write settings"
            - pkg: desktop/internal/recents
              desc: "analyzers report findings and do not write the recents list"
            - pkg: desktop/internal/bridge
              desc: "the REAPER bridge executes project actions; an analyzer must not reach it"
            - pkg: desktop/internal/process
              desc: "analyzers do not launch sidecars or other processes"
            - pkg: desktop/internal/transcript
              desc: "Transcript Compare exports markers into the project; an analyzer must not depend on it"
    gosec:
      excludes:
        # G304 flags every os.Open or os.ReadFile whose path is not a constant. This is a local
        # desktop app whose job is to open the manuscripts, projects, audio and catalogs the person
        # chose, so a variable path is the design, not a finding. There is no remote caller: paths
        # are checked where they enter (host bindings require absolute paths and resolve
        # project-relative ones, see docs/architecture/host-binding-concurrency.md).
        - G304
        # G703 is G304's taint-analysis twin: it follows a variable path (an environment variable, a
        # decoded file) into the same os.Open calls, so the same reasoning applies. It first fired on
        # the gated LibriVox corpus test, whose corpus directory comes from NARRATION_SIGNAL_CORPUS.
        - G703
        # G301 wants directories created 0750 or tighter. The app creates its data and the
        # project's narration-studio folders 0755 on purpose: a REAPER project can live on a share or be
        # read by a second account, and every file in them is written 0600 (G306 stays on). Windows,
        # the supported platform, ignores the mode.
        - G301
  exclusions:
    rules:
      # G204 and its taint-analysis twin G702 in the process supervisor: it exists to launch the sidecar executables (bundled Python
      # tools, resolved by the host) with arguments the host builds. The program is never text the
      # user typed into a field.
      - path: internal/process/
        linters: [gosec]
        text: "G204|G702"
      # Tests write fixtures under t.TempDir and build binary test data, so file-mode, integer
      # conversion and path rules add noise there and nothing else. errcheck and staticcheck still run.
      - path: _test\.go
        linters: [gosec]
