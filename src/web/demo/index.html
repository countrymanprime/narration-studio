<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      // Sets data-theme before first paint so the correct palette (see
      // src/studio/ui/src/styles.css's :root[data-theme='dark'] block) applies
      // immediately, instead of flashing light and then swapping to dark
      // once ThemeProvider (src/studio/ui/src/theme/ThemeContext.tsx) mounts.
      // Mirrors that module's readStoredPreference()/resolveTheme() logic;
      // kept duplicated here since inline scripts can't import it.
      (function () {
        try {
          var stored = localStorage.getItem('narration-ui-theme');
          var preference = stored === 'light' || stored === 'dark' || stored === 'system' ? stored : 'system';
          var dark = preference === 'dark' || (preference === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) document.documentElement.setAttribute('data-theme', 'dark');
        } catch (error) {
          // Storage/matchMedia unavailable - fall back to the default light palette.
        }
        // Inside the public site's window frame (a sandboxed frame with no storage), the site hands over its theme and its Play animations switch in
        // the address (src/web/demo/src/siteWindow.ts; VITE_SITE is replaced by Vite, so other builds skip this).
        if ('%VITE_SITE%' === '1') {
          var handed = new URLSearchParams(location.search);
          if (handed.get('embed') === '1') {
            if (handed.get('siteTheme') === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
            if (handed.get('siteTheme') === 'light') document.documentElement.removeAttribute('data-theme');
            if (handed.get('motion') === 'play') document.documentElement.setAttribute('data-motion', 'play');
          }
        }
        // Settings -> Motion -> Reduce sets data-motion before first paint, so nothing moves on the first frame
        // (src/studio/ui/src/motion.ts, applyMotion; same key, duplicated for the same reason).
        try {
          if (localStorage.getItem('narration-ui-motion') === 'reduce') document.documentElement.setAttribute('data-motion', 'reduce');
          // The public demo's "Play animations" switch (src/web/demo/src/DemoBanner.tsx) wins over both, and exists only in a demo build (VITE_DEMO is replaced by Vite there).
          if ('%VITE_DEMO%' === '1' && localStorage.getItem('narration-ui-demo-play-motion') === '1')
            document.documentElement.setAttribute('data-motion', 'play');
        } catch (error) {
          // Storage unavailable - follow Windows.
        }
      })();
    </script>
    <!-- One local icon: a page with none makes the browser ask for /favicon.ico (a 404). An empty data: icon ahead of this one hides it. -->
    <link rel="icon" type="image/png" href="/favicon.png" />
    <title>%BRAND_NAME%</title>
  </head>
  <body>
    <!-- isolate: the app is one stacking context, so the popups the primitives portal to <body> (dialogs, tooltips, popovers, drawers) always stack above page content. -->
    <div id="root" class="isolate"></div>
    <script type="module" src="./src/entry.ts"></script>
  </body>
</html>
