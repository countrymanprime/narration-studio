packages:
  - src/studio/ui
  - src/web
  - src/studio/desktop

allowBuilds:
  esbuild: true
  nx: true

# Install-time supply-chain settings, written out so a pnpm default that changes cannot change them silently
# (docs/operations/ci-and-releases.md, "Workflow security"). They matter most in a session that runs `pnpm add`
# or `pnpm update`; CI installs with --frozen-lockfile and takes exactly what the lockfile pins.
#
# A version must be at least three days old (in minutes) before pnpm resolves it, so a freshly published malicious
# release is not picked up. Matches the Dependabot cooldown for npm's minor and patch updates. To take an urgent
# security fix sooner, add `name@version` to minimumReleaseAgeExclude for that one install and remove it after.
minimumReleaseAge: 4320
# Owner-approved and temporary: stable @wailsio/runtime 3.1.0 was published 2026-11-01. Remove this entry once it is three days old.
minimumReleaseAgeExclude:
  - '@wailsio/runtime@3.1.0'
# Transitive dev-tool dependencies pinned by their parents below the patched version (#1133): nx pins undici and minimatch,
# markdownlint-cli2 pins markdown-it, smol-toml, katex and re2js, mermaid pins dompurify, commitlint's ajv pins fast-uri and storybook's
# docgen plugin pins glob. Each override is a floor (>=), so a parent that moves past it is not held back; drop an entry when
# `pnpm audit` is clean without it. None of these ships in the desktop app (`pnpm audit --prod` is clean).
overrides:
  undici@7: '>=7.30.1'
  minimatch@<11.0.1: '>=11.0.1'
  dompurify@<3.4.17: '>=3.4.17'
  markdown-it@>=15.0.0 <15.0.3: '>=15.0.3'
  smol-toml@<1.9.0: '>=1.9.0'
  fast-uri@<3.1.9: '>=3.1.9'
  katex@<0.18.2: '>=0.18.2'
  glob@>=9.0.0 <14.0.2: '>=14.0.2'
  re2js@<2.8.7: '>=2.8.7'
# Fail the install when a dependency has a build script that allowBuilds above does not name.
strictDepBuilds: true
# Refuse a transitive dependency that comes from a git repository or a tarball URL instead of the registry.
blockExoticSubdeps: true
