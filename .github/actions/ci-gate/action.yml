name: CI gate
description: >-
  The body of ci.yml's gate job (`CI passed`, named `CI light passed` on a draft): fails unless every job the gate needs ended
  success or skipped, then runs the whole-run checks that read the shards' uploads. The results check runs first and a red one
  stops the rest, so a red shard is reported as that, not as missing uploads.

# The caller checks the repository out first (persist-credentials: false) and passes `${{ join(needs.*.result, ' ') }}`.
inputs:
  results:
    description: "`join(needs.*.result, ' ')` of the calling job"
    required: true
  expect:
    description: How many jobs the caller needs; a different count fails (a `needs:` entry dropped without this being changed)
    required: true
  vitest-shards:
    description: >-
      The number of Test (Linux) shards whose Vitest blobs to merge (`coverage-gate.mjs vitest src/studio/ui --merge=N`: fails when a blob is
      missing, reports every test and checks every coverage floor of scripts/ci/coverage-floors.json over the merged coverage, as the
      unsharded run does); '0' when the Vitest run did not run (the UI not affected)
    default: '0'
  visual-shards:
    description: >-
      The number of Test (Linux) shards whose visual capture records to judge with `visual:check-run`
      (src/studio/ui/tests/visual/whole-run.check.ts); '0' when the visual suite did not run (light tier, or the UI not affected)
    default: '0'

runs:
  using: composite
  steps:
    - name: Every needed job passed or was skipped
      shell: bash
      env:
        RESULTS: ${{ inputs.results }}
        EXPECT: ${{ inputs.expect }}
      run: node scripts/ci/needs-results.mjs --expect "$EXPECT"
    - if: inputs.vitest-shards != '0' || inputs.visual-shards != '0'
      uses: ./.github/actions/setup-toolchain
      with:
        need-go: 'false'
        need-python: 'false'
        need-wails-tools: 'false'
        need-stylua: 'false'
        need-linux-native-deps: 'false'
        pnpm-filter: ui
    - if: inputs.vitest-shards != '0'
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        pattern: vitest-blob-*
        merge-multiple: true
        path: .cache/coverage/vitest-src-studio-ui-blobs
    - if: inputs.vitest-shards != '0'
      name: Merge the Vitest shards and check the coverage floors
      shell: bash
      env:
        SHARDS: ${{ inputs.vitest-shards }}
      run: node scripts/ci/coverage-gate.mjs vitest src/studio/ui --merge="$SHARDS"
    # The whole-run half of the visual gate over every shard's capture records: every capture present, none blank, no two states
    # identical unless declared sameAs, every sameAs still holding, and the shards held every test of the suite exactly once.
    # It reads records only (no browser).
    - if: inputs.visual-shards != '0'
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        pattern: ui-visual-records-*
        merge-multiple: true
        path: src/studio/ui/screenshots/.run
    - if: inputs.visual-shards != '0'
      name: Judge the visual shards' records together
      shell: bash
      env:
        UI_VISUAL_SHARDS: ${{ inputs.visual-shards }}
      run: pnpm --dir src/studio/ui run visual:check-run
