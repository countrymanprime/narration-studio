name: Setup toolchain
description: Install pnpm, Node, Go, Python, uv, and the pinned build tools shared by CI and release workflows

inputs:
  need-node:
    description: Install a Node runtime (some release scripts are plain Node with no deps)
    default: 'true'
  need-pnpm:
    description: Install pnpm and run `pnpm install --frozen-lockfile` (implies need-node)
    default: 'true'
  pnpm-filter:
    description: Limit the install to workspace projects, space-separated (for example `workspace` for the root tooling, enough to run Nx); empty installs every workspace project
    default: ''
  need-python:
    description: Install Python and uv, and sync the locked environment
    default: 'true'
  python-sync-args:
    description: Extra arguments for `uv sync --locked`, for example `--only-group lua` to install only the REAPER harness group (Lua 5.4 through lupa, and ruff) instead of every Python dependency
    default: ''
  need-go:
    description: Install Go
    default: 'true'
  need-wails-tools:
    description: Install the pinned Wails CLI (implies need-go)
    default: 'true'
  need-golangci-lint:
    description: Install the pinned Go linters, golangci-lint and checklocks (implies need-go)
    default: 'false'
  need-stylua:
    description: Install the pinned standalone StyLua binary
    default: 'true'
  need-linux-native-deps:
    description: Install the native GTK 4 and WebKitGTK 6.0 libs needed to build and test the Wails v3 app on Linux
    default: 'true'

runs:
  using: composite
  steps:
    - if: runner.os == 'Linux' && inputs.need-linux-native-deps == 'true'
      shell: bash
      # Wails v3 links GTK 4 and WebKitGTK 6.0 through cgo on Linux; v2 used GTK 3 and WebKit2GTK 4.1.
      run: sudo apt-get update && sudo apt-get install -y libglib2.0-dev libgtk-4-dev libwebkitgtk-6.0-dev libsoup-3.0-dev librsvg2-dev patchelf
    - if: inputs.need-pnpm == 'true'
      uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      with: { version: 11.27.0 }
    - if: inputs.need-node == 'true'
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
      with:
        node-version: 22
        cache: ${{ inputs.need-pnpm == 'true' && 'pnpm' || '' }}
        cache-dependency-path: pnpm-lock.yaml
    - if: inputs.need-go == 'true' || inputs.need-wails-tools == 'true' || inputs.need-golangci-lint == 'true'
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: '1.27.3'
        cache-dependency-path: src/studio/desktop/go.sum
    - if: inputs.need-python == 'true'
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
      with: { python-version: '3.12' }
    - if: inputs.need-python == 'true'
      uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      with:
        version: 0.12.15
        enable-cache: true
        cache-dependency-glob: |
          pyproject.toml
          uv.lock
    # `go install` compiles each tool from source (about a minute apiece), so the binaries are cached.
    # The key hashes scripts/toolchain.json, which pins the versions installed below (keep them in step).
    - if: inputs.need-wails-tools == 'true'
      id: wails-cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/go/bin/wails3${{ runner.os == 'Windows' && '.exe' || '' }}
        key: go-tool-wails3-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/toolchain.json') }}
    - if: inputs.need-wails-tools == 'true' && steps.wails-cache.outputs.cache-hit != 'true'
      name: Install pinned Wails CLI
      shell: bash
      # The CLI only renders files, generates bindings and resources; it needs no webview, so it is built without cgo on every runner.
      env:
        CGO_ENABLED: '0'
      run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.1.0
    # golangci-lint is built here with the job's Go toolchain (`go install`), not downloaded as a release
    # binary: a prebuilt binary is compiled with one Go version and refuses to lint a module that targets a newer one.
    - if: inputs.need-golangci-lint == 'true'
      id: golangci-lint-cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/go/bin/golangci-lint${{ runner.os == 'Windows' && '.exe' || '' }}
        key: go-tool-golangci-lint-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/toolchain.json') }}
    - if: inputs.need-golangci-lint == 'true' && steps.golangci-lint-cache.outputs.cache-hit != 'true'
      name: Install pinned golangci-lint
      shell: bash
      run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.14.0
    # gVisor's lock checker, run as its own binary by the lint target (scripts/quality.mjs go-lint). It has no releases; the
    # pseudo-version pins a commit of gVisor's `go` branch.
    - if: inputs.need-golangci-lint == 'true'
      id: checklocks-cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/go/bin/checklocks${{ runner.os == 'Windows' && '.exe' || '' }}
        key: go-tool-checklocks-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/toolchain.json') }}
    - if: inputs.need-golangci-lint == 'true' && steps.checklocks-cache.outputs.cache-hit != 'true'
      name: Install pinned checklocks
      shell: bash
      run: go install gvisor.dev/gvisor/tools/checklocks/cmd/checklocks@v0.0.0-20260924014505-db6c1a7c24b4
    # The action fetches the release list and the binary from GitHub; a blip there failed pull requests (#3260). The first
    # attempt may fail; the second runs after a pause and fails the job if it fails too.
    - if: inputs.need-stylua == 'true'
      id: stylua
      name: Install pinned standalone StyLua
      continue-on-error: true
      uses: JohnnyMorganz/stylua-action@479972f01e665acfcba96ada452c36608bdbbb5e # v4.1.0
      with:
        token: ${{ github.token }}
        version: v2.1.0
        args: false
    - if: inputs.need-stylua == 'true' && steps.stylua.outcome == 'failure'
      name: Wait before the StyLua retry
      shell: bash
      run: sleep 30
    - if: inputs.need-stylua == 'true' && steps.stylua.outcome == 'failure'
      name: Install pinned standalone StyLua (retry)
      uses: JohnnyMorganz/stylua-action@479972f01e665acfcba96ada452c36608bdbbb5e # v4.1.0
      with:
        token: ${{ github.token }}
        version: v2.1.0
        args: false
    - if: inputs.need-pnpm == 'true'
      name: Install pnpm dependencies
      shell: bash
      env:
        PNPM_FILTER: ${{ inputs.pnpm-filter }}
      run: |
        filters=()
        for project in $PNPM_FILTER; do filters+=(--filter "$project"); done
        pnpm install --frozen-lockfile "${filters[@]}"
    - if: inputs.need-python == 'true'
      name: Sync Python dependencies
      shell: bash
      env:
        PYTHON_SYNC_ARGS: ${{ inputs.python-sync-args }}
      run: uv sync --locked $PYTHON_SYNC_ARGS
