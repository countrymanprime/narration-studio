# Applied by .github/workflows/labeler.yml. Every label named here must exist in
# .github/labels.json (a test enforces that). These are the only labels that say which part of the repository a pull
# request touches; Dependabot sets only `dependencies` (.github/dependabot.yml). A path may match more than one label.
area:ui:
  - changed-files:
      - any-glob-to-any-file: src/studio/ui/**

area:site:
  - changed-files:
      - any-glob-to-any-file: src/web/**

area:shell:
  - changed-files:
      - any-glob-to-any-file: src/studio/desktop/**

area:python:
  - changed-files:
      - any-glob-to-any-file:
          - src/studio/libs/python/**
          - src/studio/sidecars/**
          - pyproject.toml
          - uv.lock

area:reaper:
  - changed-files:
      - any-glob-to-any-file: src/studio/integrations/reaper/**

area:audacity:
  - changed-files:
      - any-glob-to-any-file: src/studio/integrations/audacity/**

area:tests:
  - changed-files:
      - any-glob-to-any-file: tests/**

area:ci-release:
  - changed-files:
      - any-glob-to-any-file:
          - .github/**
          - .husky/**
          - .claude/**
          - .vscode/**
          - scripts/**
          - config/**
          - nx.json
          - project.json
          - commitlint.config.cjs
          - lint-staged.config.mjs
          - knip.jsonc
          - stylua.toml
          - package.json
          - pnpm-lock.yaml
          - pnpm-workspace.yaml
          - .editorconfig
          - .gitattributes
          - .gitignore
          - .prettierrc.json
          - .prettierignore
          - .markdownlint-cli2.jsonc
          - .lychee.toml
          - .lycheeignore

area:docs:
  - changed-files:
      - any-glob-to-any-file:
          - docs/**
          - tools/**
          - '*.md'
          - LICENSE
