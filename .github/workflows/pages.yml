name: Pages
# Publishes the public site (src/web, built by src/web/build/build-demo-site.mjs into dist-site/) to GitHub Pages:
# the landing page at the root, the condensed guides under /docs/, the windowed demo of the app under /demo/ and the
# Storybook component atlas under /storybook/. It is served at https://countrymanprime.github.io/narration-studio/ once the
# owner sets Settings > Pages > Source to "GitHub Actions" (an owner-only setting, see docs/operations/github-workflow.md);
# until then the deploy job fails with GitHub's "Pages is not enabled" message and the build job still proves the site builds.
#
# Every link inside the site is relative, so the build needs no base path; the link check below runs with the project
# sub-path /narration-studio/ to prove nothing reaches for the host's root. SITE_PUBLISHED=1 drops the "preview, not
# published" notice that other builds of the site carry (src/web/build/shell.mjs).
#
# A pull request builds and checks the site but uploads nothing and never reaches the deploy job, which also refuses any
# ref but main (a manual start from a branch builds and stops). The token is read-only everywhere except the deploy job,
# which alone holds `pages: write` (create the deployment) and `id-token: write` (prove to Pages that the artifact came
# from this workflow run).
on:
  push:
    branches: [main]
    paths:
      - src/web/**
      - src/studio/ui/src/**
      - src/studio/ui/.storybook/**
      - src/studio/ui/package.json
      - src/studio/ui/vite.config.ts
      - docs/images/ui/**
      - docs/guides/**
      - tools/docs-site/check_site.py
      - pnpm-lock.yaml
      - .github/workflows/pages.yml
  pull_request:
    paths:
      - src/web/**
      - src/studio/ui/src/**
      - src/studio/ui/.storybook/**
      - src/studio/ui/package.json
      - src/studio/ui/vite.config.ts
      - docs/images/ui/**
      - docs/guides/**
      - tools/docs-site/check_site.py
      - pnpm-lock.yaml
      - .github/workflows/pages.yml
  workflow_dispatch:
permissions: {}
# One deployment at a time, and a running one finishes: cancelling a deploy half way leaves the site stale. A pull request
# run only builds, so a newer push to the same pull request cancels the older run.
concurrency:
  group: pages-${{ github.event_name == 'pull_request' && github.ref || 'deploy' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  build:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-toolchain
        with:
          need-go: 'false'
          need-wails-tools: 'false'
          need-stylua: 'false'
          need-linux-native-deps: 'false'
          need-python: 'false'
      # The whole site: the app in its site mode (mock host, one self-contained page), the guides, and Storybook. No backend,
      # no secret. The build fails if any page loads something from another host or by an absolute path.
      - name: Build the site
        env:
          SITE_PUBLISHED: '1'
        run: pnpm --dir src/web run build:site
      # check_site.py reads only the standard library. It follows every link and image of the built pages as Pages would
      # serve them under /narration-studio/ and fails on a dead one.
      - name: Check every link, served under /narration-studio/
        run: |
          python3 -I tools/docs-site/check_site.py dist-site --base /narration-studio/ \
            --site-url https://countrymanprime.github.io/narration-studio/ \
            --require index.html --require docs/index.html --require demo/index.html --require demo/app.html \
            --require storybook/index.html --require storybook/sb/index.html
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist-site
  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    timeout-minutes: 10
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
