name: Windows REAPER transport timing
# Scripted, non-gating evidence for release-gate check 9.7 (docs/operations/windows-qa-checklist.md, section 9). It installs the
# REAPER evaluation build on a GitHub-hosted runner, runs the real narration_ui_bridge.lua in an isolated -cfgfile, presses
# Play, Stop, Record and Pause through REAPER's transport actions and records the play state and the heartbeat after each. Manual
# only; nothing requires it. The runner has no audio hardware, so a state REAPER refuses to enter is a finding in the report.
on:
  # TEMPORARY: lets GitHub register this workflow so it can be dispatched from this branch before it is on main. Removed before merge.
  push:
    branches: [ci/windows-release-gate-evidence]
    paths: ['.github/workflows/windows-reaper-transport.yml']
  workflow_dispatch:
    inputs:
      reaper-version:
        description: REAPER version to install (the repository's recorded runs used 7.80)
        default: '7.80'
      installer-sha256:
        description: Pinned SHA-256 of the installer (empty = record it only)
        default: ''
permissions: { contents: read }
concurrency:
  group: windows-reaper-transport-${{ github.ref }}
  cancel-in-progress: false
jobs:
  transport:
    name: 9.7 REAPER play-state timing
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install REAPER, run the transport script in an isolated session
        shell: pwsh
        env:
          REAPER_VERSION: ${{ inputs.reaper-version || '7.80' }}
          INSTALLER_SHA256: ${{ inputs.installer-sha256 }}
        run: ./scripts/release/windows-reaper-transport-check.ps1 -OutDir "$env:RUNNER_TEMP/transport-report" -Version $env:REAPER_VERSION -ExpectedSha256 $env:INSTALLER_SHA256
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: reaper-transport-9-7
          path: ${{ runner.temp }}/transport-report/
          if-no-files-found: warn
          retention-days: 14
