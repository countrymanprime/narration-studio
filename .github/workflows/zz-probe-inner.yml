name: Probe inner (temporary, #3845)
# Temporary: stands in for ci.yml. One job reaches its time limit; a gate job then fails, as `CI passed` does.
on:
  workflow_call: {}
permissions: {}
jobs:
  slow:
    timeout-minutes: 1
    runs-on: ubuntu-latest
    steps:
      - run: sleep 150
  gate:
    needs: slow
    if: always()
    timeout-minutes: 2
    runs-on: ubuntu-latest
    steps:
      - run: exit 1
