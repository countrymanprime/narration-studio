name: Site preview
# Builds the public demo site (src/web/build/build-demo-site.mjs, docs/operations/public-demo-site.md) and uploads it as a workflow artifact.
# Manual only, read-only token, no secret, and nothing is published or deployed: this workflow never touches GitHub Pages and has no
# `pages: write` or `id-token: write`. `pages.yml` stays the only way to publish.
on:
  workflow_dispatch:
permissions: {}
concurrency:
  group: site-preview-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-toolchain
        with:
          need-go: 'false'
          need-wails-tools: 'false'
          need-stylua: 'false'
          need-linux-native-deps: 'false'
          need-python: 'false'
      - name: Build the site
        run: pnpm run site:build
      - name: Check the site never says the product's old name
        run: node scripts/ci/old-name.mjs dir dist-site
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: demo-site
          path: dist-site
          if-no-files-found: error
          retention-days: 14
