name: Real Audacity 3 (Windows)
# Drives a real Audacity 3.7.7 over its Windows named pipes with the raw client in tests/audacity3/real/edits (A3-T30, docs/research/
# audacity-3-capability-matrix.md). Hosted, manual, and evidence only: nothing requires it and it never runs on a pull request or a
# schedule. The windows-latest image has no audio device, so no recording row can run here.
#
# It installs only the hash-pinned portable zip in the job's temp folder and never uploads it or any extracted file (GPLv3
# redistribution): only the test results, the job summary and the log.
on:
  workflow_dispatch:
permissions: {}
concurrency:
  group: real-audacity3-windows-${{ github.ref }}
  cancel-in-progress: false
jobs:
  real-audacity3-windows:
    name: Audacity 3.7.7 over named pipes (windows-latest)
    runs-on: windows-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run A3-T30
        shell: pwsh
        run: |
          ./tests/audacity3/real/edits/windows.ps1 -Work "$env:RUNNER_TEMP\nu-audacity-win"
      # The zip and the extracted tree stay out of the artifact: only what the tests wrote.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: real-audacity3-windows
          path: |
            ${{ runner.temp }}/nu-audacity-win/out/results.json
            ${{ runner.temp }}/nu-audacity-win/out/summary.md
            ${{ runner.temp }}/nu-audacity-win/out/results/
          if-no-files-found: warn
          retention-days: 14
