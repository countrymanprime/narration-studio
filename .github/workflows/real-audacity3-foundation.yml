name: Real Audacity 3 foundation tests (Linux)
# Runs the foundation suite (A3-T1 to T13, T24 to T29, T34 of docs/research/audacity-3-capability-matrix.md) against a pinned, real Audacity
# 3 over mod-script-pipe: Xvfb, a PulseAudio null sink, the hash-pinned AppImage, the pinned LibriVox chapter. The tests are in
# apps/desktop/internal/audacityreal/foundation and tests/audacity3/real/foundation/run.sh runs them. Each test records its rows (pass, fail,
# skip, measurement, the raw reply bytes) into results.json, which is uploaded as an artifact and summarised in the job summary.
# Evidence, not a gate: it runs on a manual dispatch and on a pull request that touches the files it exercises, and nothing requires it.
# A second workflow, real-audacity3.yml, holds the earlier prototype; the record, punch and edit suites live in their own files.
#
# The job installs packages and the hash-pinned AppImage; it never uploads the AppImage or an extracted tree (GPLv3 redistribution), only
# the test output, screenshots, raw replies and the audio the tests exported. Audacity's version and SHA-256 are in run.sh.
on:
  workflow_dispatch:
    inputs:
      pattern:
        description: 'Which tests to run, as a go test -run expression (for example TestA3T0[1-3]); the default is all of them'
        type: string
        default: '.'
  pull_request:
    paths:
      - 'apps/desktop/internal/audacityreal/**'
      - 'apps/desktop/internal/audacitybridge/**'
      - 'tests/audacity3/real/foundation/**'
      - '.github/workflows/real-audacity3-foundation.yml'
permissions: {}
concurrency:
  group: real-audacity3-foundation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  foundation:
    name: Audacity 3.7.7 foundation suite
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Choose the work folder
        run: echo "NU_AUDACITY_WORK=$RUNNER_TEMP/nu-audacity" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.2'
          cache-dependency-path: apps/desktop/go.sum
      - name: Install the display, audio and helper packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb pulseaudio pulseaudio-utils libasound2-plugins xdotool ffmpeg imagemagick
      # The key is the pinned hashes' version: a new pin in run.sh is a new key. The recordings are keyed by the fixture's own pins.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ env.NU_AUDACITY_WORK }}/bin/*.AppImage
            ${{ env.NU_AUDACITY_WORK }}/fixtures/*.mp3
          key: real-audacity3-foundation-${{ hashFiles('tests/audacity3/real/foundation/run.sh', 'tests/fixtures/audio/librivox-alice/sources.json') }}
      - name: Run the foundation tests
        env:
          PATTERN: ${{ inputs.pattern || '.' }}
        run: |
          set -o pipefail
          mkdir -p "$NU_AUDACITY_WORK"
          tests/audacity3/real/foundation/run.sh "$PATTERN" 2>&1 | tee "$NU_AUDACITY_WORK/run.log"
      # run.sh writes results.json and summary.md and appends the summary to the job summary; this covers a run that died before it could.
      - name: Say so when no rows were written
        if: always()
        run: |
          if [ ! -f "$NU_AUDACITY_WORK/out/summary.md" ]; then
            { echo '### Real Audacity 3 foundation suite'; echo; echo 'No results were written: see the run log artifact.'; } >> "$GITHUB_STEP_SUMMARY"
          fi
      # No AppImage and no extracted tree: only what the tests wrote.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: real-audacity3-foundation
          path: |
            ${{ env.NU_AUDACITY_WORK }}/run.log
            ${{ env.NU_AUDACITY_WORK }}/out/
            ${{ env.NU_AUDACITY_WORK }}/logs/
          if-no-files-found: warn
          retention-days: 14
