name: Test ratchet
# Tests only ratchet up (scripts/ci/test-ratchet.mjs): a pull request should not delete a test file, add a skip or focus
# marker to one, or lower a coverage floor. The check is advisory: it prints every violation and raises a warning
# annotation, and it never fails the pull request, so nobody has to approve a deliberate change. The agent-train
# coordinator and reviewers read the warning. The check runs the script as it is on the base branch, so a pull request
# cannot edit its own gate; a pull request that adds the script runs its own copy, once. Not a required check (#544).
on:
  pull_request:
    types: [opened, synchronize, reopened]
permissions: { contents: read }
concurrency:
  group: test-ratchet-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  ratchet:
    name: Test ratchet
    timeout-minutes: 5
    runs-on: ubuntu-latest
    env:
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: |
          script="$RUNNER_TEMP/test-ratchet.mjs"
          git show "$BASE_SHA:scripts/ci/test-ratchet.mjs" > "$script" 2>/dev/null || cp scripts/ci/test-ratchet.mjs "$script"
          if node "$script" "$BASE_SHA"; then exit 0; fi
          echo "::warning title=Test ratchet::This change weakens a test or lowers a coverage floor (listed above). Say in the pull request why it is intended."
          exit 0
