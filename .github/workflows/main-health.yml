name: Main health
# The full CI run (quality, the sharded visual suites, the UI bundle, the Windows build) on `main` after each push and every three hours, when `main`
# has a commit it has not run on. The agent train merges on the light gate (D43) and runs the full suite only at the end (D44), and two
# pull requests that were each green alone can break together once both are merged (startupRequests.spec.ts did, 2026-10-18), so a
# regression can sit on `main` unseen. When this run fails it ticks HOLD on every open train issue, so no new worker launches onto a red `main`
# (docs/operations/agent-train.md, "Safety net"). The owner or the coordinator clears HOLD once `main` is green.
#
# Two triggers. A push to `main` finds a regression within about one run (35 minutes on 2026-11-09) of the merge that caused it; the schedule
# stays as the backstop. GitHub ran the schedule only 2 to 3 times a day on 2026-11-04 to
# 11-06, an hour or two late, so on its own a regression sat on `main` for up to about ten hours (#3131).
#
# The concurrency group does not cancel: a cancelled run judges nothing, and merges 26 to 60 minutes apart (2026-11-07) would cancel each
# other for a whole afternoon. A run in progress finishes and at most one newer run waits behind it (GitHub replaces an older waiting
# run), so a burst of merges costs the run in progress plus one, never one run per merge. The `changed` job still skips a scheduled run
# when the last finished run was on the same commit; a push or a manual run always runs.
on:
  push:
    branches: [main]
  schedule:
    - cron: '37 */3 * * *'
  workflow_dispatch: {}
permissions: { contents: read }
concurrency:
  group: main-health
  cancel-in-progress: false
jobs:
  changed:
    name: Has main moved since the last run
    timeout-minutes: 5
    runs-on: ubuntu-latest
    permissions:
      actions: read # to list this workflow's earlier runs
    outputs:
      run: ${{ steps.compare.outputs.run }}
    steps:
      - id: compare
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT" != schedule ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "A $EVENT run always runs."
            exit 0
          fi
          # The newest run that finished with a verdict (a cancelled run judged nothing), on any trigger.
          last=$(gh api "repos/$GH_REPO/actions/workflows/main-health.yml/runs?branch=main&status=completed&per_page=20" \
            --jq '[.workflow_runs[] | select(.conclusion == "success" or .conclusion == "failure")][0].head_sha // ""')
          if [ "$last" = "$SHA" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "::notice::main is still at $SHA, which the last finished run already judged; skipping the full run."
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "main moved from '${last:-none}' to $SHA."
          fi
  ci:
    needs: changed
    if: needs.changed.outputs.run == 'true'
    uses: ./.github/workflows/ci.yml
  hold-on-red:
    name: Tick HOLD when main is red
    needs: ci
    # `always()`: without a status function the condition is "success() && ...", which skips this job exactly when `ci` failed.
    if: always() && needs.ci.result == 'failure'
    timeout-minutes: 5
    runs-on: ubuntu-latest
    permissions:
      contents: read # to check out the script
      issues: write # to edit the train issues
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: |
          node scripts/ci/train-health.mjs hold "the scheduled full CI run on main failed ($RUN_URL)"
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
