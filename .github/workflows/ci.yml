name: CI
on:
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  workflow_dispatch:
  workflow_call:
permissions: { contents: read }
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    uses: ./.github/workflows/_quality.yml
  ui-dist:
    uses: ./.github/workflows/_ui-dist.yml
  # Windows is the only supported platform, so it is the only native build.
  # This job needs only the UI bundle, so it runs alongside the quality jobs rather than after them.
  build-windows:
    name: Build (Windows)
    needs: ui-dist
    timeout-minutes: 30
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/build-native
        with:
          platform: windows-x64
      # The packaged program, setup program, notices and checksums of this pull request, for a by-hand launch on Windows (the owner's
      # check of a shell change, for example the Wails v3 migration). Never a release: releases are built by prerelease.yml.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: narration-utils-windows-x64
          path: release-assets/
          if-no-files-found: error
          retention-days: 7

  # One check that sums up the run, for a ruleset to require (#544) instead of every job by name: sharding, folding or
  # renaming a job then changes nothing a ruleset lists, and a job skipped because Nx found nothing affected counts as
  # passed. `always()` so it reports red, not skipped, when a job it needs fails. A documentation-only pull request does
  # not run this workflow (paths-ignore above), so requiring this check also needs that trigger changed.
  ci-passed:
    name: CI passed
    needs: [quality, ui-dist, build-windows]
    if: always()
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "needed jobs: $RESULTS"
          for result in $RESULTS; do
            case "$result" in
              success|skipped) ;;
              *) echo "::error::a job this run needs ended $result"; exit 1 ;;
            esac
          done
      # The whole-run half of the visual gate (apps/ui/tests/visual/whole-run.check.ts) over every shard's capture records: every
      # capture present, none blank, no two states identical unless declared sameAs, every sameAs still holding, and the shards held
      # every test of the suite exactly once. It reads records only (no browser), and ran as a job of its own after the shards; here it
      # saves that job's queueing and start-up on the critical path. A step that fails fails `CI passed`. Skipped when the UI is not
      # affected (the shards captured nothing). The steps above ran first, so a red shard is reported as that, not as missing records.
      - if: needs.quality.outputs.ui-affected == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - if: needs.quality.outputs.ui-affected == 'true'
        uses: ./.github/actions/setup-toolchain
        with:
          need-go: 'false'
          need-python: 'false'
          need-wails-tools: 'false'
          need-stylua: 'false'
          need-linux-native-deps: 'false'
          pnpm-filter: narration-utils-ui
      - if: needs.quality.outputs.ui-affected == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: ui-visual-records-*
          merge-multiple: true
          path: apps/ui/screenshots/.run
      - if: needs.quality.outputs.ui-affected == 'true'
        env:
          UI_VISUAL_SHARDS: '3'
        run: pnpm --dir apps/ui run visual:check-run
