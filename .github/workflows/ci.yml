name: CI
# Two tiers (docs/operations/ci-and-releases.md#draft-and-ready-tiers). A draft pull request runs the light tier: the Quality jobs
# except the Playwright suites (js, quick-ubuntu, quick-windows, go-test) and a `CI light passed` check. Everything else (a ready pull
# request, a manual run, main-health) runs the full tier and `CI passed`. `CI passed` is never produced by a light run, so a draft
# cannot show a green that means less than the full gate.
on:
  pull_request:
    # `ready_for_review` starts the full tier when a draft is marked ready; the default three types are kept.
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  workflow_dispatch:
  workflow_call:
permissions: { contents: read }
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    uses: ./.github/workflows/_quality.yml
    with:
      full: ${{ github.event.pull_request.draft != true }}
  ui-dist:
    if: github.event.pull_request.draft != true
    uses: ./.github/workflows/_ui-dist.yml
  # Windows is the only supported platform, so it is the only native build.
  # This job needs only the UI bundle, so it runs alongside the quality jobs rather than after them.
  build-windows:
    name: Build (Windows)
    needs: ui-dist
    if: github.event.pull_request.draft != true
    timeout-minutes: 30
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/build-native
        with:
          platform: windows-x64
      # The packaged program, setup program, notices and checksums of this pull request, for a by-hand launch on Windows (the owner's
      # check of a shell change, for example the Wails v3 migration). Never a release: releases are built by prerelease.yml.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: narration-utils-windows-x64
          path: release-assets/
          if-no-files-found: error
          retention-days: 7

  # One check that sums up the run, for a ruleset to require (#544) instead of every job by name: sharding, folding or
  # renaming a job then changes nothing a ruleset lists, and a job skipped because Nx found nothing affected counts as
  # passed. `always()` so it reports red, not skipped, when a job it needs fails. A documentation-only pull request does
  # not run this workflow (paths-ignore above), so requiring this check also needs that trigger changed.
  # The full tier only: a draft pull request skips this job, so its check list shows no `CI passed` (the merge conditions in
  # agent-train/SKILL.md require it). A skipped job inside the full run (the UI not affected) still counts as passed.
  ci-passed:
    name: CI passed
    needs: [quality, ui-dist, build-windows]
    if: always() && github.event.pull_request.draft != true
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "needed jobs: $RESULTS"
          for result in $RESULTS; do
            case "$result" in
              success|skipped) ;;
              *) echo "::error::a job this run needs ended $result"; exit 1 ;;
            esac
          done
      # The whole-run half of the visual gate (apps/ui/tests/visual/whole-run.check.ts) over every shard's capture records: every
      # capture present, none blank, no two states identical unless declared sameAs, every sameAs still holding, and the shards held
      # every test of the suite exactly once. It reads records only (no browser), and ran as a job of its own after the shards; here it
      # saves that job's queueing and start-up on the critical path. A step that fails fails `CI passed`. Skipped when the UI is not
      # affected (the shards captured nothing). The steps above ran first, so a red shard is reported as that, not as missing records.
      - if: needs.quality.outputs.ui-affected == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - if: needs.quality.outputs.ui-affected == 'true'
        uses: ./.github/actions/setup-toolchain
        with:
          need-go: 'false'
          need-python: 'false'
          need-wails-tools: 'false'
          need-stylua: 'false'
          need-linux-native-deps: 'false'
          pnpm-filter: narration-utils-ui
      - if: needs.quality.outputs.ui-affected == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: ui-visual-records-*
          merge-multiple: true
          path: apps/ui/screenshots/.run
      - if: needs.quality.outputs.ui-affected == 'true'
        env:
          UI_VISUAL_SHARDS: '3'
        run: pnpm --dir apps/ui run visual:check-run

  # What a draft pull request shows instead of `CI passed`. It sums up only what the light tier ran, and its name says so. It is
  # not a merge condition: marking the pull request ready runs the full tier.
  ci-light-passed:
    name: CI light passed
    needs: [quality]
    if: always() && github.event.pull_request.draft == true
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "light tier (no visual suite, no atlas, no Windows build); needed jobs: $RESULTS"
          for result in $RESULTS; do
            case "$result" in
              success|skipped) ;;
              *) echo "::error::a job this run needs ended $result"; exit 1 ;;
            esac
          done
