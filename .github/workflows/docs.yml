name: Docs
# The checks of a pull request's text and docs: the PR title against the commit convention (the squash merge uses it as the
# commit), the docs and guide impact of the change, the link check of every Markdown file in the repository
# (docs/operations/ci-and-releases.md#the-docs-link-check), a fast Markdown style lint of the files the pull request touches, and,
# when it touches the public site's sources, the built site with its old-name and link checks (pages.yml publishes it from main).
#
# There is deliberately NO path filter on the pull_request trigger. ci.yml skips documentation-only pull requests, so a
# path-filtered docs job would also skip a code change that renames a file a doc links to, and a required check that
# GitHub skips stays pending forever. This workflow runs on every pull request, so its job is safe to require later.
#
# One job, `docs`, runs the five checks as steps (each step has `if: !cancelled()`, so a red one does not hide the next,
# the way Test (Linux) does in _quality.yml). They were five jobs, each paying for its own runner and checkout; the step
# names are the old job names, so a log reads the same. The scheduled online link check stays a job of its own.
#
# links-offline reads only the repository (lychee --offline: a relative link must resolve to a file, a `#fragment` to a
# heading of that file) and does not touch the network, so it is deterministic. links-online also follows the http(s)
# links, which rot on their own, so it runs weekly and by hand and only reports: it never blocks a pull request.
on:
  pull_request:
    # `edited` re-runs the docs-impact and guide-impact steps when the description gains a `Docs: none — <reason>` or
    # `No guide change: <reason>` line, re-checks the title against the commit convention, and re-checks the title and description
    # for the issue-link warning.
    types: [opened, synchronize, reopened, edited]
  schedule:
    - cron: '17 7 * * 1'
  workflow_dispatch: {}
permissions: { contents: read }
concurrency:
  group: docs-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  docs:
    name: Docs checks
    # The schedule exists for the online link job.
    if: github.event_name != 'schedule'
    timeout-minutes: 20
    runs-on: ubuntu-latest
    # The steps that need a base to diff or a description to read are pull request steps; a manual run has neither.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The changed-file scripts diff against the merge base with the pull request's base branch, so they need that
          # history, not just the head commit.
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-toolchain
        with:
          need-go: 'false'
          need-python: 'false'
          need-wails-tools: 'false'
          need-stylua: 'false'
          need-linux-native-deps: 'false'
      - name: PR title (commit convention)
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        env:
          # Read through env, never interpolated into the script.
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        # Dependabot's own titles are normalized first (dependabot-title.yml rewrites the real title, but its edit does not
        # re-run this check); every other author's title is linted as written.
        run: |
          title="$PR_TITLE"
          if [ "$PR_AUTHOR" = 'dependabot[bot]' ]; then title="$(node scripts/ci/dependabot-title.mjs)"; fi
          printf '%s\n' "$title" | pnpm exec commitlint --verbose
      - name: Markdown lint (changed files)
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        run: node scripts/ci/lint-markdown-changed.mjs --summary
      - name: Docs impact
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        env:
          # The description may carry the `Docs: none — <reason>` opt-out. Read through env, never interpolated into the script.
          PR_BODY: ${{ github.event.pull_request.body }}
        run: node scripts/ci/docs-impact.mjs --summary
      - name: Guide impact
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        env:
          # The description may carry the `No guide change: <reason>` opt-out. Read through env, never interpolated into the script.
          PR_BODY: ${{ github.event.pull_request.body }}
        run: node scripts/ci/guide-impact.mjs --summary
      - name: Guide structure
        # docsGuide.test.ts holds the how-to guide's breadcrumbs, footers, links, What next sections and screenshot embeds.
        # ci.yml ignores Markdown-only changes, so without this step a guide-only pull request would never run it.
        if: ${{ !cancelled() }}
        run: pnpm --dir src/studio/ui run test:guide
      - name: Issue link (advisory)
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        env:
          # Read through env, never interpolated into the script. The script only warns and exits 0.
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_BASE: ${{ github.event.pull_request.base.ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: node scripts/ci/pr-issue-link.mjs --summary
      - name: Docs prose (filler phrases in the Markdown this pull request changes)
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        run: node scripts/ci/docs-slop.mjs --summary
      - name: Docs prose (a backticked path or pnpm script that no longer exists)
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        run: node scripts/ci/docs-references.mjs --strict --summary
      # The action downloads the lychee binary from GitHub; a blip there failed pull requests (#3260). Offline mode is
      # deterministic, so a failed first attempt is retried once after a pause and the second result decides.
      - name: Links (offline)
        id: links-offline
        if: ${{ !cancelled() }}
        continue-on-error: true
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          lycheeVersion: v0.24.2
          args: --config .lychee.toml --offline --no-progress .
          # Blocking: the baseline is clean (0 dead repository links) and offline mode is deterministic.
          fail: true
      - name: Links (offline, retry)
        if: ${{ !cancelled() && steps.links-offline.outcome == 'failure' }}
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          lycheeVersion: v0.24.2
          args: --config .lychee.toml --offline --no-progress .
          fail: true
      # The public site, built and checked as pages.yml builds it, on a pull request that touches its sources (pages.yml's paths).
      - name: Site sources changed
        id: site
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          changed="$(git diff --name-only "$(git merge-base "$BASE_SHA" HEAD)" HEAD)"
          if grep -qE '^(src/web/|src/studio/ui/src/|src/studio/ui/\.storybook/|src/studio/ui/package\.json$|src/studio/ui/vite\.config\.ts$|docs/images/ui/|docs/guides/|tools/docs-site/check_site\.py$|pnpm-lock\.yaml$|\.github/workflows/(docs|pages)\.yml$)' <<< "$changed"; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
      # No backend, no secret. The build fails if any page loads something from another host or by an absolute path.
      - name: Build the site
        id: site-build
        if: ${{ !cancelled() && steps.site.outputs.changed == 'true' }}
        env:
          SITE_PUBLISHED: '1'
        run: pnpm --dir src/web run build:site
      - name: Check the site never says the product's old name
        if: ${{ !cancelled() && steps.site-build.outcome == 'success' }}
        run: node scripts/ci/old-name.mjs dir dist-site
      # check_site.py reads only the standard library. It follows every link and image of the built pages as Pages would serve them
      # under the repository's sub-path and fails on a dead one.
      - name: Check every site link, served under the repository's sub-path
        if: ${{ !cancelled() && steps.site-build.outcome == 'success' }}
        env:
          OWNER: ${{ github.repository_owner }}
          REPOSITORY: ${{ github.event.repository.name }}
        run: |
          python3 -I tools/docs-site/check_site.py dist-site --base "/$REPOSITORY/" \
            --site-url "https://$OWNER.github.io/$REPOSITORY/" \
            --require index.html --require docs/index.html --require demo/index.html --require demo/app.html \
            --require storybook/index.html --require storybook/sb/index.html
  links-online:
    name: Links (online, advisory)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Remembered answers for a day, so a weekly run does not re-ask every host about every URL.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .lycheecache
          key: lychee-${{ github.run_id }}
          restore-keys: lychee-
      - uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          lycheeVersion: v0.24.2
          args: --config .lychee.toml --cache --max-cache-age 1d --no-progress .
          # Reports in the job summary and never fails: a link on someone else's server is not this repository's regression.
          fail: false
        env:
          # Only to lift GitHub's anonymous rate limit on the links to github.com.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
