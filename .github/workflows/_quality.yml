name: Quality
on:
  workflow_call:
    outputs:
      ui-affected:
        description: "'true' when Nx found ui affected, so the visual shards ran and ci.yml's `CI passed` judges their records"
        value: ${{ jobs.lint.outputs.ui }}
      vitest-affected:
        description: "'true' when the ui-unit shards ran the Vitest run and uploaded its blobs, which ci.yml's aggregate merges"
        value: ${{ jobs.ui-unit.outputs.affected }}
    inputs:
      full:
        description: >-
          true runs every job. false is the light tier of a draft pull request (ci.yml): the Playwright suites (ui-visual,
          the atlas steps of ui-unit) and Build (Windows) are skipped and the rest runs. Only ci.yml's `CI passed` may sum up a full run; a light run reports as
          `CI light passed`.
        type: boolean
        default: true
permissions: { contents: read }
# Every job runs its Nx targets through .github/actions/nx-run: on a pull request only the projects
# the change affects (see each project's project.json and `implicitDependencies`), otherwise all of
# them. The Playwright jobs keep their own `run:` steps (they pass a shard) and use .github/actions/nx-affected to
# decide whether to run. docs/operations/ci-and-releases.md lists the jobs as GitHub shows them; ci.yml's `CI passed`
# job is the one check that sums them up (no ruleset requires any check yet, #544). Checkouts fetch full history so Nx
# can diff against the base branch.
#
# The shape trades job slots against the critical path (docs/research/2026-11-06-ci-job-grouping.md, #3065): a pull request
# should hold about 10 runners at once so two can run side by side. The visual suite is most of a UI pull request's wait, so it is
# sharded and sets the critical path; every other check shares a runner with checks that need the same toolchain, one check per
# step with `if: ${{ !cancelled() }}` so a red step hides none after it, and a summary step (scripts/ci/step-summary.mjs) that
# reports each. scripts/ci/check-manifest.json records which job and step runs each check.
jobs:
  lint:
    # Runs first; every other job waits for it, so a lint finding stops the run before the long jobs start (owner decision, #3065).
    # Two parts:
    #   - Scope: which job families the change reaches, so the others are skipped (no runner, no toolchain setup) instead of starting,
    #     installing and finding nothing to do. Same rule as every nx-run / nx-affected step (scripts/ci/nx-scope.sh: everything on a
    #     manual run or a workspace-wide file, else `nx show projects --affected`).
    #       - ui: the ui-unit shards (Vitest and the atlas) and the visual shards.
    #       - shell: go-test (the Go tests and lint, and the Lua harness on Windows), so the reaper project or the shell.
    #     A skipped job counts as passed in ci.yml's `CI passed`; the steps inside those jobs keep their own scope check.
    #     A pull request whose workflow changes are only `uses:` pin bumps (Dependabot) is not `all` here: the nx-affected steps run
    #     nx-scope.sh --pins, and the `pins` step (scripts/ci/workflow-pins.mjs, pin-flags.mjs) ORs in the families of the jobs that
    #     contain a changed pin (a changed local action: every job that uses it). On a pure pin bump the lint steps run only when this job
    #     is reached (`static`) and the quick test steps of linux-checks only when that job is (`quickubuntu`). Any other change under
    #     .github/workflows or .github/actions (a `run:`, `if:`, `with:` or `needs:` line, a step, job or file added or removed) is `all`.
    #   - Lint, one step per project family, each on its affected projects: ui static and web static (lint, format, architecture and
    #     node:test of the UI and site projects, the site's typecheck and Vitest run), Knip (every workspace, so `always`), python lint
    #     (ruff and the typecheck of the Python projects), reaper lint (StyLua and ruff on the bridge), docs-site lint (`always`).
    #     Go lint runs on Windows in go-test (it needs the Windows build tags). Then the test ratchet (advisory, pull requests only).
    name: lint
    timeout-minutes: 20
    runs-on: ubuntu-latest
    outputs:
      ui: ${{ steps.ui.outputs.affected == 'true' || steps.pins.outputs.ui == 'true' }}
      shell: ${{ steps.shell.outputs.affected == 'true' || steps.pins.outputs.shell == 'true' }}
      static: ${{ steps.pins.outputs.static }}
      quickubuntu: ${{ steps.pins.outputs.quickubuntu }}
      ui-dist: ${{ steps.ui-dist.outcome == 'success' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0, persist-credentials: false }
      - uses: ./.github/actions/setup-toolchain
        with:
          need-go: 'false'
          need-wails-tools: 'false'
          need-linux-native-deps: 'false'
          python-sync-args: --group docs
      - id: ui
        uses: ./.github/actions/nx-affected
        with:
          projects: ui
          pins: 'true'
      - id: shell
        uses: ./.github/actions/nx-affected
        with:
          projects: reaper,desktop
          pins: 'true'
      # Only a pull request can be a pin bump; elsewhere the classifier is skipped and the self-scoped jobs start.
      - id: pins
        env:
          BASE_REF: ${{ github.base_ref }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "pull_request" ]; then
            node scripts/ci/workflow-pins.mjs "origin/$BASE_REF" | tee "$RUNNER_TEMP/pins.json"
          else
            echo '{"kind":"none"}' > "$RUNNER_TEMP/pins.json"
          fi
          node scripts/ci/pin-flags.mjs --github-output < "$RUNNER_TEMP/pins.json"

      # The UI bundle Build (Windows) packages (full tier): built here on Linux and uploaded as `ui-dist`, so the Windows build starts with
      # the other jobs once lint has passed. It cannot be built on the Windows runner: tsc there resolves `./PageBreaks` and `./pageBreaks`
      # (and `./EntryTable` and `./entryTable`) to one file on the case-insensitive file system and fails. First, so a red lint step below
      # cannot hold it back; its `tsc --noEmit` is the UI's typecheck.
      - name: UI bundle
        id: ui-bundle
        if: inputs.full
        run: pnpm --dir src/studio/ui run build
      - id: ui-dist
        if: inputs.full
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ui-dist
          path: src/studio/ui/dist
          if-no-files-found: error
          retention-days: 1
      - name: ui static
        id: ui-static
        if: ${{ !cancelled() && steps.pins.outputs.static == 'true' }}
        uses: ./.github/actions/nx-run
        with:
          targets: lint format architecture test-node
          projects: ui
      - name: web static
        id: web-static
        if: ${{ !cancelled() && steps.pins.outputs.static == 'true' }}
        uses: ./.github/actions/nx-run
        with:
          targets: lint format architecture typecheck test-node test
          projects: web
      - name: knip
        id: knip
        if: ${{ !cancelled() && steps.pins.outputs.static == 'true' }}
        uses: ./.github/actions/nx-run
        with:
          targets: knip
          projects: workspace
          always: 'true'
      - name: python lint
        id: python-lint
        if: ${{ !cancelled() && steps.pins.outputs.static == 'true' }}
        uses: ./.github/actions/nx-run
        with:
          targets: lint typecheck
          projects: tag:toolchain:python,fixtures
      - name: reaper lint
        id: reaper-lint
        if: ${{ !cancelled() && steps.pins.outputs.static == 'true' }}
        uses: ./.github/actions/nx-run
        with:
          targets: lint
          projects: reaper
      - name: docs-site lint
        id: docs-site-lint
        if: ${{ !cancelled() && steps.pins.outputs.static == 'true' }}
        uses: ./.github/actions/nx-run
        with:
          targets: lint
          projects: docs-site
          always: 'true'
      # Tests only ratchet up (scripts/ci/test-ratchet.mjs): a pull request should not delete a test file, add a skip or focus marker to
      # one, or lower a coverage floor. Advisory: it prints every violation and raises a warning annotation, and never fails, so nobody
      # has to approve a deliberate change; the coordinator and reviewers read the warning. It runs the script as it is on the base
      # branch, so a pull request cannot edit its own check; a pull request that adds the script runs its own copy, once.
      - name: test ratchet
        id: test-ratchet
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          script="$RUNNER_TEMP/test-ratchet.mjs"
          git show "$BASE_SHA:scripts/ci/test-ratchet.mjs" > "$script" 2>/dev/null || cp scripts/ci/test-ratchet.mjs "$script"
          if node "$script" "$BASE_SHA"; then exit 0; fi
          echo "::warning title=Test ratchet::This change weakens a test or lowers a coverage floor (listed above). Say in the pull request why it is intended."
          exit 0
      - name: Summary
        if: always()
        env:
          OUTCOMES: >-
            {"UI bundle": "${{ steps.ui-bundle.outcome }}", "ui static": "${{ steps.ui-static.outcome }}", "web static": "${{ steps.web-static.outcome }}",
            "knip": "${{ steps.knip.outcome }}", "python lint": "${{ steps.python-lint.outcome }}",
            "reaper lint": "${{ steps.reaper-lint.outcome }}", "docs-site lint": "${{ steps.docs-site-lint.outcome }}",
            "test ratchet": "${{ steps.test-ratchet.outcome }}"}
        run: node scripts/ci/step-summary.mjs
  linux-checks:
    # Every Linux test under a few minutes (the lint job holds the lint), on one runner with one toolchain install (Go, Python with the docs group, every pnpm
    # project, StyLua). These were four jobs (js-static, quick-ubuntu, rename rehearsal, ui-dist / build), each paying for its own setup.
    #   - repo-scripts, docs-site, python, reaper (`quickubuntu`): the plain-Node scripts (`always`: the layout and project guards read every
    #     tracked file), the docs site's unit tests (`always`: docs/ belongs to no project; Pages runs the built site's link check), pytest of
    #     the Python projects (Go is installed for the transcript-compare tests) and the bridge harness under Lua 5.4:
    #     on a pull request its characterization tests (the `pr` configuration), on every other run with its mutation checks too.
    #   - rename rehearsal, every pull request: renames a throwaway worktree of this commit to a made-up name and runs the brand sync, both
    #     name guards and the tests that read the name (scripts/brand/rehearse-rename.mjs, #2251 item 41). main-health runs `--full`,
    #     which adds the UI typecheck and the built site with its retired-name check (#3078).
    # 45 min: before #3078 the `--full` rehearsal (main-health, a manual run) re-ran every suite and took up to 36 min alone; on a pull
    # request the four jobs it replaces ran 9.7 min together on run 41966422733, each setup included.
    name: linux-checks
    needs: lint
    timeout-minutes: 45
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0, persist-credentials: false }
      # No GTK 4 or WebKitGTK: the rename rehearsal, `--full` included, runs `go vet` and the brand tests, which need neither.
      - uses: ./.github/actions/setup-toolchain
        with:
          need-go: 'true'
          need-wails-tools: 'false'
          need-linux-native-deps: 'false'
          python-sync-args: --group docs
      - name: repo-scripts
        id: repo-scripts
        if: ${{ !cancelled() && needs.lint.outputs.quickubuntu == 'true' }}
        uses: ./.github/actions/nx-run
        with:
          targets: test-node
          projects: repo-scripts
          always: 'true'
      - name: docs-site
        id: docs-site
        if: ${{ !cancelled() && needs.lint.outputs.quickubuntu == 'true' }}
        uses: ./.github/actions/nx-run
        with:
          targets: test
          projects: docs-site
          always: 'true'
      - name: python
        id: python
        if: ${{ !cancelled() && needs.lint.outputs.quickubuntu == 'true' }}
        uses: ./.github/actions/nx-run
        with:
          targets: test
          projects: tag:toolchain:python,fixtures
      - name: reaper (Lua)
        id: reaper
        if: ${{ !cancelled() && needs.lint.outputs.quickubuntu == 'true' }}
        uses: ./.github/actions/nx-run
        with:
          targets: test
          projects: reaper
          configuration: ${{ github.event_name == 'pull_request' && 'pr' || '' }}
      - name: rename rehearsal
        id: rename
        if: ${{ !cancelled() }}
        env:
          FULL: ${{ github.event_name != 'pull_request' && '--full' || '' }}
        run: node scripts/brand/rehearse-rename.mjs $FULL
      - name: Summary
        if: always()
        env:
          OUTCOMES: >-
            {"repo-scripts": "${{ steps.repo-scripts.outcome }}", "docs-site": "${{ steps.docs-site.outcome }}",
            "python": "${{ steps.python.outcome }}", "reaper (Lua)": "${{ steps.reaper.outcome }}",
            "rename rehearsal": "${{ steps.rename.outcome }}"}
        run: node scripts/ci/step-summary.mjs

  ui-unit:
    # The Vitest run of src/studio/ui (every test, coverage on the gated logic files) and, in the full tier, the component library atlas
    # (every Storybook story x light/dark x wide/narrow, with play() interactions, axe and overflow checks; src/studio/ui/tests/atlas), a
    # third of each per job. These were five jobs (three Vitest shards, two atlas shards): one setup now serves both.
    #   - Vitest: `vitest --shard=i/3` split by cost (src/studio/ui/scripts/vitest-shards.mjs). A shard checks no coverage floor; it uploads
    #     a blob of its results and coverage, and ci.yml's aggregate (`.github/actions/ci-gate`) merges the three and checks the floors of
    #     scripts/ci/coverage-floors.json over the whole run. No Nx cache and no retry.
    #   - atlas (full tier, after the Vitest step so a red one hides neither): `pnpm atlas --shard=i/3`; shard 1 also checks docs/ui equals a
    #     fresh generation (fix with `pnpm --dir src/studio/ui docs:atlas`).
    # 30 min: 3.3 to 6.7 min of Vitest and about 6 of atlas per shard, behind a `setup-playwright` that took up to 9 min on a slow runner.
    name: ui-unit (shard ${{ matrix.shard }}/3)
    needs: lint
    if: needs.lint.outputs.ui == 'true'
    timeout-minutes: 30
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    outputs:
      affected: ${{ steps.scope.outputs.affected }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0, persist-credentials: false }
      - uses: ./.github/actions/setup-toolchain
        with:
          need-go: 'false'
          need-python: 'false'
          need-wails-tools: 'false'
          need-stylua: 'false'
          need-linux-native-deps: 'false'
      - id: scope
        uses: ./.github/actions/nx-affected
        with:
          projects: ui
      - name: vitest
        id: vitest
        if: steps.scope.outputs.affected == 'true'
        env:
          SHARD: ${{ matrix.shard }}
        run: node scripts/ci/coverage-gate.mjs vitest src/studio/ui --shard="$SHARD/3"
      # `.cache` is a hidden directory, which upload-artifact leaves out unless told.
      - if: steps.scope.outputs.affected == 'true' && !cancelled()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vitest-blob-${{ matrix.shard }}
          path: .cache/coverage/vitest-src-studio-ui-blobs
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1
      - if: inputs.full && steps.scope.outputs.affected == 'true' && !cancelled()
        uses: ./.github/actions/setup-playwright
      - name: atlas
        id: atlas
        if: inputs.full && steps.scope.outputs.affected == 'true' && !cancelled()
        env:
          SHARD: ${{ matrix.shard }}
        run: pnpm --dir src/studio/ui run atlas --shard="$SHARD/3"
      - name: atlas docs
        id: atlas-docs
        if: inputs.full && steps.scope.outputs.affected == 'true' && matrix.shard == 1 && !cancelled()
        run: pnpm exec nx run ui:atlas-docs --skip-nx-cache
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: ui-atlas-screenshots-${{ matrix.shard }}
          path: src/studio/ui/screenshots/atlas
          if-no-files-found: ignore
          retention-days: 7
      - name: Summary
        if: always()
        env:
          OUTCOMES: >-
            {"vitest": "${{ steps.vitest.outcome }}", "atlas": "${{ steps.atlas.outcome }}", "atlas docs": "${{ steps.atlas-docs.outcome }}"}
        run: node scripts/ci/step-summary.mjs

  ui-visual-shard:
    # Captures every {page, state, viewport} of the mock-backed app and fails on errors, sideways overflow and collapsed
    # controls per capture (src/studio/ui/tests/visual/lib/capture.ts). Not a pixel-diff gate. A quarter of the suite per job. The checks
    # that need the whole run (blank, undeclared duplicate, stale sameAs, and that the shards held every test) cannot run in a
    # shard (UI_VISUAL_SHARDED=1 defers them), so each shard uploads its capture records and a manifest of what it was given, and
    # `CI passed` (ci.yml) judges them together.
    # The split is by measured time (scripts/ci/visual-shards.mjs and src/studio/ui/tests/visual/shard-weights.json), not by test count:
    # Playwright's --shard cut the list into equal counts, and the shards ran 12 m 14 s to 14 m 22 s with `aria` on the longest.
    # The split puts `aria` (about 49 s) on whichever shard the balance wants.
    # 30 minutes: shards 1 and 2 ran 12.7 to 14.5 minutes of a 15 minute limit and then timed out once the overlay guard
    # (a test per overlay, window size and position, for every page that adopts it) grew. A 20 minute limit then cancelled passing
    # shards on 2026-10-23: `setup-playwright` (the system libraries, `playwright install --with-deps`) took 7.5 minutes on a slow
    # runner and left about 12 for the screenshots.
    # Four shards (#3054): the suite grew to about 2360 tests, and three balanced shards (1338 to 1368 s of tests each on run 42182391318,
    # 22.8 min by Playwright's clock) left a slow runner, with `setup-playwright` at 9 minutes, past the 30 minute limit on shards that
    # failed no test. A quarter each is about 17 minutes of tests. The limit stays 30: the balance was not the problem.
    name: ui-visual (shard ${{ matrix.shard }}/4)
    needs: lint
    if: inputs.full && needs.lint.outputs.ui == 'true'
    timeout-minutes: 30
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    outputs:
      affected: ${{ steps.scope.outputs.affected }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0, persist-credentials: false }
      - uses: ./.github/actions/setup-toolchain
        with:
          need-go: 'false'
          need-python: 'false'
          need-wails-tools: 'false'
          need-stylua: 'false'
          need-linux-native-deps: 'false'
      - id: scope
        uses: ./.github/actions/nx-affected
        with:
          projects: ui
      - if: steps.scope.outputs.affected == 'true'
        uses: ./.github/actions/setup-playwright
      # Lists the suite (no browser), gives this shard its tests and says whether this shard also runs `aria`. Fails if the shards do not
      # hold every test exactly once.
      - id: split
        if: steps.scope.outputs.affected == 'true'
        env:
          SHARD: ${{ matrix.shard }}
        run: node scripts/ci/visual-shards.mjs split --shard "$SHARD/4" --out "$RUNNER_TEMP/shard.txt" --manifest "$RUNNER_TEMP/shard-$SHARD.json" --github-output
      # The JSON report is the profile (time per test); a shard uploads it as ui-visual-timings-<i> and `visual-shards.mjs weights` rebuilds
      # shard-weights.json from the four.
      - if: steps.scope.outputs.affected == 'true'
        env:
          UI_VISUAL_SHARDED: '1'
          SHARD: ${{ matrix.shard }}
          PLAYWRIGHT_JSON_OUTPUT_NAME: ${{ runner.temp }}/timings.json
        run: pnpm --dir src/studio/ui run screenshots --test-list "$RUNNER_TEMP/shard.txt" --reporter=list,json
      # The role trees of the dialogs, the slide-over and the navigation (tests/aria): 22 tests, about 50 s, on the shard the split names.
      # After the screenshots so a red visual run does not hide it and the reverse.
      - if: steps.scope.outputs.affected == 'true' && steps.split.outputs.aria == 'true' && !cancelled()
        run: pnpm --dir src/studio/ui run aria
      # The manifest goes in the records directory, so it is uploaded with them. `mkdir`: a shard that failed before its first test has none.
      - if: steps.scope.outputs.affected == 'true' && !cancelled()
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          mkdir -p src/studio/ui/screenshots/.run
          cp "$RUNNER_TEMP/shard-$SHARD.json" src/studio/ui/screenshots/.run/
      # `.run` is a hidden directory, which upload-artifact leaves out unless told. A shard that drew only the overlay guard's tests
      # (they capture no screenshots, so write no records) still uploads its manifest.
      - if: steps.scope.outputs.affected == 'true' && !cancelled()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ui-visual-records-${{ matrix.shard }}
          path: src/studio/ui/screenshots/.run
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1
      - if: steps.scope.outputs.affected == 'true' && !cancelled()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ui-visual-timings-${{ matrix.shard }}
          path: ${{ runner.temp }}/timings.json
          if-no-files-found: ignore
          retention-days: 14
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: ui-visual-screenshots-${{ matrix.shard }}
          path: src/studio/ui/screenshots/app
          if-no-files-found: ignore
          retention-days: 7
      # Playwright keeps a trace only for a failing test (`trace: 'retain-on-failure'`), so a green run has nothing
      # to upload and a red one ships a trace.zip per failing test. Open it with `playwright show-trace`.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: ui-visual-traces-${{ matrix.shard }}
          path: src/studio/ui/test-results
          if-no-files-found: ignore
          retention-days: 3
  go-test:
    # The Windows checks, two jobs split by what each package cost on the Windows runner (run 39138316593): the raced root package
    # took 405 s, the other raced packages ran beside it, the plain packages 33 s and `test-schedules` 118 s.
    #   - root: the module's root package with the race detector (the `ci-root` configuration of the test target), then go lint
    #     (gofmt, go vet, golangci-lint and checklocks: the `ci` configuration of the lint target).
    #   - rest: the other raced packages and the plain ones (`ci-rest`), then the teleprompter and shutdown tests on one and on four CPUs
    #     (`test-schedules`: an ordering bug between goroutines that hides on the default scheduler fails there on demand), then the
    #     bridge harness under Lua 5.4 on Windows, because the bridge builds paths from package.config and REAPER's own Lua writes CRLF.
    # Each job checks the coverage floors of the packages it ran (scripts/ci/coverage-gate.mjs --group); together they run every package
    # once. These were three jobs: go lint and the Windows harness had a runner of their own (quick-windows), whose 20 minutes were 15.6
    # of the harness's mutation checks.
    # The mutation checks: a pull request runs the harness's `pr` configuration (the characterization tests, about a minute) here and in
    # linux-checks; every other run (main-health, a manual run) and post-merge.yml run the mutation checks on both. Windows is the only supported platform and Linux's native libraries are not installed on the
    # Linux runners, so Go is tested and linted here.
    # 30 min: the median was 11 (root) and 15 (rest) min, the longest 16.1, plus about 2 for lint or the harness; a main-health run's
    # mutation checks add up to 15 to `rest`.
    needs: lint
    if: needs.lint.outputs.shell == 'true'
    name: go-test (${{ matrix.part }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { part: root, configuration: ci-root, schedules: false, lint: true, lua: false }
          - { part: rest, configuration: ci-rest, schedules: true, lint: false, lua: true }
    timeout-minutes: 40
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0, persist-credentials: false }
      # No Python for the Go steps: Go tests that need the real sidecars skip themselves when the checkout has no `.venv`, and a
      # half-synced one (the Lua group only) would make them run and fail. The Lua harness's Python comes after them.
      - uses: ./.github/actions/setup-toolchain
        with:
          need-python: 'false'
          need-wails-tools: 'false'
          need-stylua: 'false'
          need-golangci-lint: ${{ matrix.lint }}
          pnpm-filter: workspace
      - name: go test
        id: go-test
        uses: ./.github/actions/nx-run
        with:
          targets: test
          projects: desktop
          configuration: ${{ matrix.configuration }}
      - name: go test-schedules
        id: schedules
        if: ${{ matrix.schedules && !cancelled() }}
        uses: ./.github/actions/nx-run
        with:
          targets: test-schedules
          projects: desktop
      - name: go lint
        id: go-lint
        if: ${{ matrix.lint && !cancelled() }}
        uses: ./.github/actions/nx-run
        with:
          targets: lint
          projects: desktop
          configuration: ci
      - name: Python and StyLua for the Lua harness
        if: ${{ matrix.lua && !cancelled() }}
        uses: ./.github/actions/setup-toolchain
        with:
          need-node: 'false'
          need-pnpm: 'false'
          need-go: 'false'
          need-wails-tools: 'false'
          python-sync-args: --only-group lua
      - name: reaper (Lua)
        id: reaper
        if: ${{ matrix.lua && !cancelled() }}
        uses: ./.github/actions/nx-run
        with:
          targets: lint test
          projects: reaper
          configuration: ${{ github.event_name == 'pull_request' && 'pr' || '' }}
      - name: Summary
        if: always()
        shell: bash
        env:
          OUTCOMES: >-
            {"go test": "${{ steps.go-test.outcome }}", "go test-schedules": "${{ steps.schedules.outcome }}",
            "go lint": "${{ steps.go-lint.outcome }}", "reaper (Lua)": "${{ steps.reaper.outcome }}"}
        run: node scripts/ci/step-summary.mjs

  # Windows is the only supported platform, so it is the only native build.
  build-windows:
    # The whole app from lint's `ui-dist` bundle: the Wails build, the setup program and the notices (build-native). It starts with the
    # other jobs once lint has passed.
    name: Build (Windows)
    needs: lint
    if: ${{ inputs.full && needs.lint.outputs.ui-dist == 'true' }}
    timeout-minutes: 30
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/build-native
        with:
          platform: windows-x64
      # The packaged program, setup program, notices and checksums of this pull request, for a by-hand launch on Windows (the owner's
      # check of a shell change, for example the Wails v3 migration). Never a release: releases are built by prerelease.yml.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: app-windows-x64
          path: release-assets/
          if-no-files-found: error
          retention-days: 7
