name: Quality
on:
  workflow_call:
    outputs:
      ui-affected:
        description: "'true' when Nx found narration-utils-ui affected, so the visual shards ran and ci.yml's `CI passed` judges their records"
        value: ${{ jobs.ui-visual-shard.outputs.affected }}
    inputs:
      full:
        description: >-
          true runs every job. false is the light tier of a draft pull request (ci.yml): the Playwright suites (ui-visual,
          ui-atlas) are skipped and the rest runs. Only ci.yml's `CI passed` may sum up a full run; a light run reports as
          `CI light passed`.
        type: boolean
        default: true
permissions: { contents: read }
# Every job runs its Nx targets through .github/actions/nx-run: on a pull request only the projects
# the change affects (see each project's project.json and `implicitDependencies`), otherwise all of
# them. The Playwright jobs keep their own `run:` steps (they pass a shard) and use .github/actions/nx-affected to
# decide whether to run. docs/operations/ci-and-releases.md lists the jobs as GitHub shows them; ci.yml's `CI passed`
# job is the one check that sums them up (no ruleset requires any check yet, #544). Checkouts fetch full history so Nx
# can diff against the base branch.
#
# The shape trades job slots against the critical path (docs/operations/ci-and-releases.md#ci-performance: the free plan
# runs 20 jobs at a time and queueing is the slow case). The two Playwright suites are most of a UI pull request's wait,
# so they are sharded; the jobs under a minute share a runner per OS instead of each paying for its own toolchain setup.
jobs:
  js:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0, persist-credentials: false }
      - uses: ./.github/actions/setup-toolchain
        with:
          need-go: 'false'
          need-python: 'false'
          need-wails-tools: 'false'
          need-stylua: 'false'
          need-linux-native-deps: 'false'
      - uses: ./.github/actions/nx-run
        with:
          targets: lint format architecture test test-node
          projects: narration-utils-ui
      # Knip reads every workspace, so a change anywhere can leave an unused file or export: `always`.
      - uses: ./.github/actions/nx-run
        with:
          targets: knip
          projects: narration-utils
          always: 'true'

  ui-visual-shard:
    # Captures every {page, state, viewport} of the mock-backed app and fails on errors, sideways overflow and collapsed
    # controls per capture (apps/ui/tests/visual/lib/capture.ts). Not a pixel-diff gate. A third of the suite per job. The checks
    # that need the whole run (blank, undeclared duplicate, stale sameAs, and that the shards held every test) cannot run in a
    # shard (UI_VISUAL_SHARDED=1 defers them), so each shard uploads its capture records and a manifest of what it was given, and
    # `CI passed` (ci.yml) judges them together.
    # The split is by measured time (scripts/ci/visual-shards.mjs and apps/ui/tests/visual/shard-weights.json), not by test count:
    # Playwright's --shard cut the list into equal counts, and the shards ran 12 m 14 s to 14 m 22 s with `aria` on the longest.
    # The split puts `aria` (about 49 s) on whichever shard the balance wants.
    # 20 minutes: shards 1 and 2 ran 12.7 to 14.5 minutes of a 15 minute limit and then timed out once the overlay guard
    # (a test per overlay, window size and position, for every page that adopts it) grew.
    name: ui-visual (shard ${{ matrix.shard }}/3)
    if: inputs.full
    timeout-minutes: 20
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    outputs:
      affected: ${{ steps.scope.outputs.affected }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0, persist-credentials: false }
      - uses: ./.github/actions/setup-toolchain
        with:
          need-go: 'false'
          need-python: 'false'
          need-wails-tools: 'false'
          need-stylua: 'false'
          need-linux-native-deps: 'false'
      - id: scope
        uses: ./.github/actions/nx-affected
        with:
          projects: narration-utils-ui
      - if: steps.scope.outputs.affected == 'true'
        uses: ./.github/actions/setup-playwright
      # Lists the suite (no browser), gives this shard its tests and says whether this shard also runs `aria`. Fails if the shards do not
      # hold every test exactly once.
      - id: split
        if: steps.scope.outputs.affected == 'true'
        env:
          SHARD: ${{ matrix.shard }}
        run: node scripts/ci/visual-shards.mjs split --shard "$SHARD/3" --out "$RUNNER_TEMP/shard.txt" --manifest "$RUNNER_TEMP/shard-$SHARD.json" --github-output
      # The JSON report is the profile (time per test); a shard uploads it as ui-visual-timings-<i> and `visual-shards.mjs weights` rebuilds
      # shard-weights.json from the three.
      - if: steps.scope.outputs.affected == 'true'
        env:
          UI_VISUAL_SHARDED: '1'
          SHARD: ${{ matrix.shard }}
          PLAYWRIGHT_JSON_OUTPUT_NAME: ${{ runner.temp }}/timings.json
        run: pnpm --dir apps/ui run screenshots --test-list "$RUNNER_TEMP/shard.txt" --reporter=list,json
      # The role trees of the dialogs, the slide-over and the navigation (tests/aria): 22 tests, about 50 s, on the shard the split names.
      # After the screenshots so a red visual run does not hide it and the reverse.
      - if: steps.scope.outputs.affected == 'true' && steps.split.outputs.aria == 'true' && !cancelled()
        run: pnpm --dir apps/ui run aria
      # The manifest goes in the records directory, so it is uploaded with them. `mkdir`: a shard that failed before its first test has none.
      - if: steps.scope.outputs.affected == 'true' && !cancelled()
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          mkdir -p apps/ui/screenshots/.run
          cp "$RUNNER_TEMP/shard-$SHARD.json" apps/ui/screenshots/.run/
      # `.run` is a hidden directory, which upload-artifact leaves out unless told. A shard that drew only the overlay guard's tests
      # (they capture no screenshots, so write no records) still uploads its manifest.
      - if: steps.scope.outputs.affected == 'true' && !cancelled()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ui-visual-records-${{ matrix.shard }}
          path: apps/ui/screenshots/.run
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1
      - if: steps.scope.outputs.affected == 'true' && !cancelled()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ui-visual-timings-${{ matrix.shard }}
          path: ${{ runner.temp }}/timings.json
          if-no-files-found: ignore
          retention-days: 14
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: ui-visual-screenshots-${{ matrix.shard }}
          path: apps/ui/screenshots/app
          if-no-files-found: ignore
          retention-days: 7
      # Playwright keeps a trace only for a failing test (`trace: 'retain-on-failure'`), so a green run has nothing
      # to upload and a red one ships a trace.zip per failing test. Open it with `playwright show-trace`.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: ui-visual-traces-${{ matrix.shard }}
          path: apps/ui/test-results
          if-no-files-found: ignore
          retention-days: 3

  ui-atlas:
    # The component library: every Storybook story x light/dark x wide/narrow, with play() interactions, axe accessibility
    # and overflow checks (apps/ui/tests/atlas). Half the stories per job (Playwright --shard): one job took 6.4 min. Each
    # story is judged on its own, so the shards need nothing merged. `pnpm atlas` builds Storybook first (seconds).
    name: ui-atlas (shard ${{ matrix.shard }}/2)
    if: inputs.full
    timeout-minutes: 15
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0, persist-credentials: false }
      - uses: ./.github/actions/setup-toolchain
        with:
          need-go: 'false'
          need-python: 'false'
          need-wails-tools: 'false'
          need-stylua: 'false'
          need-linux-native-deps: 'false'
      - id: scope
        uses: ./.github/actions/nx-affected
        with:
          projects: narration-utils-ui
      - if: steps.scope.outputs.affected == 'true'
        uses: ./.github/actions/setup-playwright
      - if: steps.scope.outputs.affected == 'true'
        env:
          SHARD: ${{ matrix.shard }}
        run: pnpm --dir apps/ui run atlas --shard="$SHARD/2"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: ui-atlas-screenshots-${{ matrix.shard }}
          path: apps/ui/screenshots/atlas
          if-no-files-found: ignore
          retention-days: 7

  quick-ubuntu:
    # The sub-minute Linux checks, one step each on one runner (their own jobs spent more on setup than on checking).
    # `!cancelled()` on every step: a red step does not hide the ones after it.
    #   - repo-scripts: the plain-Node scripts (GitHub metadata, release, the layout guard, the guide-screenshots tests,
    #     which need the UI project's `sharp`, so it installs too). `always`: the layout and
    #     project guards read every tracked file.
    #   - docs-site (tools/docs-site): unit tests only while GitHub Pages is paused (D75) - the
    #     strict MkDocs build and its link check over the built HTML are redundant with Docs / Links (offline)
    #     (lychee, every pull request) and Docs / Markdown lint (changed files), so they run only from pages.yml's
    #     manual build-site target, not here or in `pnpm check`. `always`: docs/ belongs to no Nx project.
    #   - python: ruff and pytest for libs/python, the sidecars, scripts/ and tests/fixtures.
    #   - reaper: stylua, then the bridge harness (integrations/reaper/tests: Lua 5.4 from lupa, a fake `reaper` driven
    #     through the file protocol, the mutation checks). quick-windows runs it on Windows too.
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0, persist-credentials: false }
      - uses: ./.github/actions/setup-toolchain
        with:
          need-go: 'false'
          need-wails-tools: 'false'
          need-linux-native-deps: 'false'
          python-sync-args: --group docs
          pnpm-filter: narration-utils narration-utils-ui
      - name: repo-scripts
        if: ${{ !cancelled() }}
        uses: ./.github/actions/nx-run
        with:
          targets: test-node
          projects: repo-scripts
          always: 'true'
      - name: docs-site
        if: ${{ !cancelled() }}
        uses: ./.github/actions/nx-run
        with:
          targets: lint test
          projects: docs-site
          always: 'true'
      - name: python
        if: ${{ !cancelled() }}
        uses: ./.github/actions/nx-run
        with:
          targets: lint test
          projects: tag:toolchain:python,fixtures
      - name: reaper (Lua)
        if: ${{ !cancelled() }}
        uses: ./.github/actions/nx-run
        with:
          targets: lint test
          projects: reaper

  quick-windows:
    # The sub-minute Windows checks on one runner:
    #   - reaper: the bridge harness again, because the bridge builds paths from package.config and REAPER's own Lua
    #     writes CRLF on Windows.
    #   - go lint: gofmt, go vet, golangci-lint and checklocks (the `ci` configuration of the lint target). Windows, like
    #     go-test: it is the only supported platform, and Linux's native libraries are not installed
    #     on the Linux runners. Here rather than in go-test so the tests do not wait behind it.
    # 25 min: the reaper step's mutation checks alone ran 12 of the 15 on Windows once the undo_last mutations joined
    # (two cancelled runs), and go lint follows them.
    timeout-minutes: 25
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0, persist-credentials: false }
      - uses: ./.github/actions/setup-toolchain
        with:
          need-wails-tools: 'false'
          need-golangci-lint: 'true'
          python-sync-args: --only-group lua
          pnpm-filter: narration-utils
      - name: reaper (Lua)
        if: ${{ !cancelled() }}
        uses: ./.github/actions/nx-run
        with:
          targets: lint test
          projects: reaper
      - name: go lint
        if: ${{ !cancelled() }}
        uses: ./.github/actions/nx-run
        with:
          targets: lint
          projects: narration-utils-shell
          configuration: ci

  go-test:
    # The tests, with the race detector on the packages that have concurrency (the `ci` configuration of the test target;
    # docs/operations/verification-tooling.md#go-lint-and-the-race-detector), then the teleprompter and shutdown tests on one and on four CPUs (`test-schedules`): an ordering bug
    # between goroutines that hides on the default scheduler fails there on demand. Lint runs in quick-windows.
    # 25 min: the median is 12 min and the longest run seen was 15.0, so a 15 min limit cancelled runs that were passing.
    timeout-minutes: 25
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0, persist-credentials: false }
      - uses: ./.github/actions/setup-toolchain
        with:
          need-python: 'false'
          need-wails-tools: 'false'
          need-stylua: 'false'
          pnpm-filter: narration-utils
      - uses: ./.github/actions/nx-run
        with:
          targets: test test-schedules
          projects: narration-utils-shell
          configuration: ci
