name: Quality
on:
  workflow_call:
    outputs:
      ui-affected:
        description: "'true' when Nx found ui affected, so the visual shards ran and ci.yml's `CI passed` judges their records"
        value: ${{ jobs.scope.outputs.ui }}
    inputs:
      full:
        description: >-
          true runs every job. false is the light tier of a draft pull request (ci.yml): the Playwright suites (ui-visual,
          ui-atlas) are skipped and the rest runs. Only ci.yml's `CI passed` may sum up a full run; a light run reports as
          `CI light passed`.
        type: boolean
        default: true
permissions: { contents: read }
# Every job runs its Nx targets through .github/actions/nx-run: on a pull request only the projects
# the change affects (see each project's project.json and `implicitDependencies`), otherwise all of
# them. The Playwright jobs keep their own `run:` steps (they pass a shard) and use .github/actions/nx-affected to
# decide whether to run. docs/operations/ci-and-releases.md lists the jobs as GitHub shows them; ci.yml's `CI passed`
# job is the one check that sums them up (no ruleset requires any check yet, #544). Checkouts fetch full history so Nx
# can diff against the base branch.
#
# The shape trades job slots against the critical path (docs/operations/ci-and-releases.md#ci-performance: the free plan
# runs 20 jobs at a time and queueing is the slow case). The two Playwright suites are most of a UI pull request's wait,
# so they are sharded; the jobs under a minute share a runner per OS instead of each paying for its own toolchain setup.
jobs:
  scope:
    # Which job families the change reaches, decided once on a cheap Linux runner so the others are skipped (no runner, no
    # toolchain setup) instead of starting, installing and finding nothing to do. Same rule as every nx-run / nx-affected step
    # (scripts/ci/nx-scope.sh: everything on a manual run or a workspace-wide file, else `nx show projects --affected`).
    #   - ui: the Vitest shards, the visual shards and the atlas.
    #   - shell: the Go tests (go-test).
    #   - winquick: quick-windows (the Lua harness on Windows and go lint), so the reaper project or the shell.
    # A skipped job counts as passed in ci.yml's `CI passed`; the steps inside those jobs keep their own scope check.
    # A pull request whose workflow changes are only `uses:` pin bumps (Dependabot) is not `all` here: the nx-affected steps run
    # nx-scope.sh --pins, and the `pins` step (scripts/ci/workflow-pins.mjs, pin-flags.mjs) ORs in the families of the jobs that contain a
    # changed pin (a changed local action: every job that uses it). On a pure pin bump js-static and quick-ubuntu start only when
    # reached (`static`, `quickubuntu`); on any other change they start as before. A job that starts runs in full. Any other change
    # under .github/workflows or .github/actions (a `run:`, `if:`, `with:` or `needs:` line, a step, job or file added or removed) is `all`.
    timeout-minutes: 10
    runs-on: ubuntu-latest
    outputs:
      ui: ${{ steps.ui.outputs.affected == 'true' || steps.pins.outputs.ui == 'true' }}
      shell: ${{ steps.shell.outputs.affected == 'true' || steps.pins.outputs.shell == 'true' }}
      winquick: ${{ steps.winquick.outputs.affected == 'true' || steps.pins.outputs.winquick == 'true' }}
      static: ${{ steps.pins.outputs.static }}
      quickubuntu: ${{ steps.pins.outputs.quickubuntu }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0, persist-credentials: false }
      - uses: ./.github/actions/setup-toolchain
        with:
          need-go: 'false'
          need-python: 'false'
          need-wails-tools: 'false'
          need-stylua: 'false'
          need-linux-native-deps: 'false'
          pnpm-filter: workspace
      - id: ui
        uses: ./.github/actions/nx-affected
        with:
          projects: ui
          pins: 'true'
      - id: shell
        uses: ./.github/actions/nx-affected
        with:
          projects: desktop
          pins: 'true'
      - id: winquick
        uses: ./.github/actions/nx-affected
        with:
          projects: reaper,desktop
          pins: 'true'
      # Only a pull request can be a pin bump; elsewhere the classifier is skipped and the self-scoped jobs start.
      - id: pins
        env:
          BASE_REF: ${{ github.base_ref }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "pull_request" ]; then
            node scripts/ci/workflow-pins.mjs "origin/$BASE_REF" | tee "$RUNNER_TEMP/pins.json"
          else
            echo '{"kind":"none"}' > "$RUNNER_TEMP/pins.json"
          fi
          node scripts/ci/pin-flags.mjs --github-output < "$RUNNER_TEMP/pins.json"

  js-static:
    needs: scope
    if: needs.scope.outputs.static == 'true'
    # The static checks of the UI and site projects and Knip, about a minute: they used to share a runner with the Vitest run, which is
    # 90% of the old `js` job's 13 minutes and now has jobs of its own (js-test-shard, js-test).
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0, persist-credentials: false }
      - uses: ./.github/actions/setup-toolchain
        with:
          need-go: 'false'
          need-python: 'false'
          need-wails-tools: 'false'
          need-stylua: 'false'
          need-linux-native-deps: 'false'
      - uses: ./.github/actions/nx-run
        with:
          targets: lint format architecture test-node
          projects: ui
      # The public site (src/web) is its own Nx project: its static checks, typecheck, node:test suites (the build scripts) and its Vitest run (the
      # extension code it plugs into the app) used to run inside the UI project and `repo-scripts`. It is affected by a change to the UI, which it builds on.
      - uses: ./.github/actions/nx-run
        with:
          targets: lint format architecture typecheck test-node test
          projects: web
      # Knip reads every workspace, so a change anywhere can leave an unused file or export: `always`.
      - uses: ./.github/actions/nx-run
        with:
          targets: knip
          projects: workspace
          always: 'true'

  js-test-shard:
    # The Vitest run of src/studio/ui (the `test` target of ui: every test, coverage on the gated logic files), a third
    # of it per job. One job took 11 m 44 s on a 2-vCPU runner. `vitest --shard=i/3` splits the files by cost
    # (src/studio/ui/scripts/vitest-shards.mjs: Vitest's own split is by a hash of the path and left one of three shards with 48% of the
    # time). A shard checks no coverage floor, since it covers a third of the files: it uploads a blob of its results and
    # coverage, and the `js-test` job below merges the three and checks the floors over the whole run.
    name: js-test (shard ${{ matrix.shard }}/3)
    needs: scope
    if: needs.scope.outputs.ui == 'true'
    timeout-minutes: 15
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    outputs:
      affected: ${{ steps.scope.outputs.affected }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0, persist-credentials: false }
      - uses: ./.github/actions/setup-toolchain
        with:
          need-go: 'false'
          need-python: 'false'
          need-wails-tools: 'false'
          need-stylua: 'false'
          need-linux-native-deps: 'false'
      - id: scope
        uses: ./.github/actions/nx-affected
        with:
          projects: ui
      # No Nx cache and no retry: a green shard means its tests ran. Not through `nx run-many`, whose `test` target is the
      # whole run (`pnpm check` and a developer's machine run that).
      - if: steps.scope.outputs.affected == 'true'
        env:
          SHARD: ${{ matrix.shard }}
        run: node scripts/ci/coverage-gate.mjs vitest src/studio/ui --shard="$SHARD/3"
      # `.cache` is a hidden directory, which upload-artifact leaves out unless told.
      - if: steps.scope.outputs.affected == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vitest-blob-${{ matrix.shard }}
          path: .cache/coverage/vitest-src-studio-ui-blobs
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  js-test:
    # The whole-run half of the Vitest gate: merges the three shards' blobs (`coverage-gate.mjs vitest src/studio/ui --merge=3`, which
    # fails when one is missing), reports the tests of all three, and checks every coverage floor of scripts/ci/coverage-floors.json
    # over the merged coverage, exactly as the unsharded run does. Reads blobs only: no test runs here. Skipped when the UI is not affected.
    needs: js-test-shard
    if: needs.js-test-shard.outputs.affected == 'true'
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: ./.github/actions/setup-toolchain
        with:
          need-go: 'false'
          need-python: 'false'
          need-wails-tools: 'false'
          need-stylua: 'false'
          need-linux-native-deps: 'false'
          pnpm-filter: ui
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: vitest-blob-*
          merge-multiple: true
          path: .cache/coverage/vitest-src-studio-ui-blobs
      - run: node scripts/ci/coverage-gate.mjs vitest src/studio/ui --merge=3

  ui-visual-shard:
    # Captures every {page, state, viewport} of the mock-backed app and fails on errors, sideways overflow and collapsed
    # controls per capture (src/studio/ui/tests/visual/lib/capture.ts). Not a pixel-diff gate. A third of the suite per job. The checks
    # that need the whole run (blank, undeclared duplicate, stale sameAs, and that the shards held every test) cannot run in a
    # shard (UI_VISUAL_SHARDED=1 defers them), so each shard uploads its capture records and a manifest of what it was given, and
    # `CI passed` (ci.yml) judges them together.
    # The split is by measured time (scripts/ci/visual-shards.mjs and src/studio/ui/tests/visual/shard-weights.json), not by test count:
    # Playwright's --shard cut the list into equal counts, and the shards ran 12 m 14 s to 14 m 22 s with `aria` on the longest.
    # The split puts `aria` (about 49 s) on whichever shard the balance wants.
    # 30 minutes: shards 1 and 2 ran 12.7 to 14.5 minutes of a 15 minute limit and then timed out once the overlay guard
    # (a test per overlay, window size and position, for every page that adopts it) grew. A 20 minute limit then cancelled passing
    # shards on 2026-10-23: `setup-playwright` (the system libraries, `playwright install --with-deps`) took 7.5 minutes on a slow
    # runner and left about 12 for the screenshots.
    name: ui-visual (shard ${{ matrix.shard }}/3)
    needs: scope
    if: inputs.full && needs.scope.outputs.ui == 'true'
    timeout-minutes: 30
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    outputs:
      affected: ${{ steps.scope.outputs.affected }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0, persist-credentials: false }
      - uses: ./.github/actions/setup-toolchain
        with:
          need-go: 'false'
          need-python: 'false'
          need-wails-tools: 'false'
          need-stylua: 'false'
          need-linux-native-deps: 'false'
      - id: scope
        uses: ./.github/actions/nx-affected
        with:
          projects: ui
      - if: steps.scope.outputs.affected == 'true'
        uses: ./.github/actions/setup-playwright
      # Lists the suite (no browser), gives this shard its tests and says whether this shard also runs `aria`. Fails if the shards do not
      # hold every test exactly once.
      - id: split
        if: steps.scope.outputs.affected == 'true'
        env:
          SHARD: ${{ matrix.shard }}
        run: node scripts/ci/visual-shards.mjs split --shard "$SHARD/3" --out "$RUNNER_TEMP/shard.txt" --manifest "$RUNNER_TEMP/shard-$SHARD.json" --github-output
      # The JSON report is the profile (time per test); a shard uploads it as ui-visual-timings-<i> and `visual-shards.mjs weights` rebuilds
      # shard-weights.json from the three.
      - if: steps.scope.outputs.affected == 'true'
        env:
          UI_VISUAL_SHARDED: '1'
          SHARD: ${{ matrix.shard }}
          PLAYWRIGHT_JSON_OUTPUT_NAME: ${{ runner.temp }}/timings.json
        run: pnpm --dir src/studio/ui run screenshots --test-list "$RUNNER_TEMP/shard.txt" --reporter=list,json
      # The role trees of the dialogs, the slide-over and the navigation (tests/aria): 22 tests, about 50 s, on the shard the split names.
      # After the screenshots so a red visual run does not hide it and the reverse.
      - if: steps.scope.outputs.affected == 'true' && steps.split.outputs.aria == 'true' && !cancelled()
        run: pnpm --dir src/studio/ui run aria
      # The manifest goes in the records directory, so it is uploaded with them. `mkdir`: a shard that failed before its first test has none.
      - if: steps.scope.outputs.affected == 'true' && !cancelled()
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          mkdir -p src/studio/ui/screenshots/.run
          cp "$RUNNER_TEMP/shard-$SHARD.json" src/studio/ui/screenshots/.run/
      # `.run` is a hidden directory, which upload-artifact leaves out unless told. A shard that drew only the overlay guard's tests
      # (they capture no screenshots, so write no records) still uploads its manifest.
      - if: steps.scope.outputs.affected == 'true' && !cancelled()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ui-visual-records-${{ matrix.shard }}
          path: src/studio/ui/screenshots/.run
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1
      - if: steps.scope.outputs.affected == 'true' && !cancelled()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ui-visual-timings-${{ matrix.shard }}
          path: ${{ runner.temp }}/timings.json
          if-no-files-found: ignore
          retention-days: 14
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: ui-visual-screenshots-${{ matrix.shard }}
          path: src/studio/ui/screenshots/app
          if-no-files-found: ignore
          retention-days: 7
      # Playwright keeps a trace only for a failing test (`trace: 'retain-on-failure'`), so a green run has nothing
      # to upload and a red one ships a trace.zip per failing test. Open it with `playwright show-trace`.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: ui-visual-traces-${{ matrix.shard }}
          path: src/studio/ui/test-results
          if-no-files-found: ignore
          retention-days: 3

  ui-atlas:
    # The component library: every Storybook story x light/dark x wide/narrow, with play() interactions, axe accessibility
    # and overflow checks (src/studio/ui/tests/atlas). Half the stories per job (Playwright --shard): one job took 6.4 min. Each
    # story is judged on its own, so the shards need nothing merged. `pnpm atlas` builds Storybook first (seconds).
    # 25 minutes: the same slow `setup-playwright` as the visual shards (up to 7.5 minutes) cancelled passing runs at 15.
    name: ui-atlas (shard ${{ matrix.shard }}/2)
    needs: scope
    if: inputs.full && needs.scope.outputs.ui == 'true'
    timeout-minutes: 25
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0, persist-credentials: false }
      - uses: ./.github/actions/setup-toolchain
        with:
          need-go: 'false'
          need-python: 'false'
          need-wails-tools: 'false'
          need-stylua: 'false'
          need-linux-native-deps: 'false'
      - id: scope
        uses: ./.github/actions/nx-affected
        with:
          projects: ui
      - if: steps.scope.outputs.affected == 'true'
        uses: ./.github/actions/setup-playwright
      - if: steps.scope.outputs.affected == 'true'
        env:
          SHARD: ${{ matrix.shard }}
        run: pnpm --dir src/studio/ui run atlas --shard="$SHARD/2"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: ui-atlas-screenshots-${{ matrix.shard }}
          path: src/studio/ui/screenshots/atlas
          if-no-files-found: ignore
          retention-days: 7

  quick-ubuntu:
    needs: scope
    if: needs.scope.outputs.quickubuntu == 'true'
    # The sub-minute Linux checks, one step each on one runner (their own jobs spent more on setup than on checking).
    # `!cancelled()` on every step: a red step does not hide the ones after it.
    #   - repo-scripts: the plain-Node scripts (GitHub metadata, release, the layout guard, the guide-screenshots tests,
    #     which need the UI project's `sharp`, so it installs too). `always`: the layout and
    #     project guards read every tracked file.
    #   - docs-site (tools/docs-site): unit tests only - Pages publishes src/web, so the strict MkDocs build
    #     is not run in CI, and the built site's link check (check_site.py) runs from pages.yml. `always`: docs/ belongs to no Nx project.
    #   - python: ruff and pytest for src/studio/libs/python, the sidecars, scripts/ and tests/fixtures. Go is installed for the
    #     transcript-compare tests, whose coverage harness and calibration measure the host's aligner through cmd/coverage-align.
    #   - reaper: stylua, then the bridge harness (src/studio/integrations/reaper/tests: Lua 5.4 from lupa, a fake `reaper` driven
    #     through the file protocol, the mutation checks). quick-windows runs it on Windows too.
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0, persist-credentials: false }
      - uses: ./.github/actions/setup-toolchain
        with:
          need-go: 'true'
          need-wails-tools: 'false'
          need-linux-native-deps: 'false'
          python-sync-args: --group docs
          pnpm-filter: workspace ui
      - name: repo-scripts
        if: ${{ !cancelled() }}
        uses: ./.github/actions/nx-run
        with:
          targets: test-node
          projects: repo-scripts
          always: 'true'
      - name: docs-site
        if: ${{ !cancelled() }}
        uses: ./.github/actions/nx-run
        with:
          targets: lint test
          projects: docs-site
          always: 'true'
      - name: python
        if: ${{ !cancelled() }}
        uses: ./.github/actions/nx-run
        with:
          targets: lint test
          projects: tag:toolchain:python,fixtures
      - name: reaper (Lua)
        if: ${{ !cancelled() }}
        uses: ./.github/actions/nx-run
        with:
          targets: lint test
          projects: reaper

  rename-rehearsal:
    # Renames a throwaway git worktree of this commit (in the temp folder, with its own node_modules and .venv from the store and
    # cache setup-toolchain filled) to a made-up name and runs the brand sync, both name guards and the tests that read the name
    # (scripts/brand/rehearse-rename.mjs), so a file that spells the product's name instead of reading it from
    # config/brand.json fails here, not at the next real rename (#2251 item 41). Every pull request, whatever it touches: any file
    # can spell the name. A pull request runs the targeted set; main-health (a scheduled or manual run) runs `--full`: every Go,
    # UI, shared-library Python and Lua test, the built site and the strict docs build. The checkout is never written to, and the job adds no permission or secret.
    needs: scope
    name: rename rehearsal
    timeout-minutes: 45
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: ./.github/actions/setup-toolchain
        with:
          need-wails-tools: 'false'
          need-stylua: 'false'
          python-sync-args: --group docs
          pnpm-filter: workspace ui web
      - env:
          FULL: ${{ github.event_name != 'pull_request' && '--full' || '' }}
        run: node scripts/brand/rehearse-rename.mjs $FULL

  quick-windows:
    # The sub-minute Windows checks on one runner:
    #   - reaper: the bridge harness again, because the bridge builds paths from package.config and REAPER's own Lua
    #     writes CRLF on Windows.
    #   - go lint: gofmt, go vet, golangci-lint and checklocks (the `ci` configuration of the lint target). Windows, like
    #     go-test: it is the only supported platform, and Linux's native libraries are not installed
    #     on the Linux runners. Here rather than in go-test so the tests do not wait behind it.
    # 25 min: the reaper step's mutation checks alone ran 12 of the 15 on Windows once the undo_last mutations joined
    # (two cancelled runs), and go lint follows them.
    needs: scope
    if: needs.scope.outputs.winquick == 'true'
    timeout-minutes: 25
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0, persist-credentials: false }
      - uses: ./.github/actions/setup-toolchain
        with:
          need-wails-tools: 'false'
          need-golangci-lint: 'true'
          python-sync-args: --only-group lua
          pnpm-filter: workspace
      - name: reaper (Lua)
        if: ${{ !cancelled() }}
        uses: ./.github/actions/nx-run
        with:
          targets: lint test
          projects: reaper
      - name: go lint
        if: ${{ !cancelled() }}
        uses: ./.github/actions/nx-run
        with:
          targets: lint
          projects: desktop
          configuration: ci

  go-test:
    # The tests, with the race detector on the packages that have concurrency (the `ci` configuration of the test target;
    # docs/operations/verification-tooling.md#go-lint-and-the-race-detector), then the teleprompter and shutdown tests on one and on four CPUs (`test-schedules`): an ordering bug
    # between goroutines that hides on the default scheduler fails there on demand. Lint runs in quick-windows.
    # Two parallel jobs, split by what each package cost on the Windows runner (run 39138316593): the raced packages took 10 m 22 s,
    # 405 s of it the module's root package alone (the other raced packages ran beside it), the plain packages 33 s and
    # `test-schedules` 118 s. `root` runs the root package; `rest` the other raced packages, the plain ones and `test-schedules`.
    # Each job checks the coverage floors of the packages it ran (scripts/ci/coverage-gate.mjs --group); together they run every package once.
    needs: scope
    if: needs.scope.outputs.shell == 'true'
    name: go-test (${{ matrix.part }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { part: root, configuration: ci-root, schedules: false }
          - { part: rest, configuration: ci-rest, schedules: true }
    # 25 min: the median is 12 min and the longest run seen was 15.0, so a 15 min limit cancelled runs that were passing.
    timeout-minutes: 25
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0, persist-credentials: false }
      - uses: ./.github/actions/setup-toolchain
        with:
          need-python: 'false'
          need-wails-tools: 'false'
          need-stylua: 'false'
          pnpm-filter: workspace
      - uses: ./.github/actions/nx-run
        with:
          targets: test
          projects: desktop
          configuration: ${{ matrix.configuration }}
      - if: ${{ matrix.schedules && !cancelled() }}
        uses: ./.github/actions/nx-run
        with:
          targets: test-schedules
          projects: desktop
