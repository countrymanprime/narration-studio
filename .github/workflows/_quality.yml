name: Quality
on:
  workflow_call:
    outputs:
      ui-affected:
        description: "'true' when Nx found ui affected, so Test (Linux) ran the visual suite in its five shards and ci.yml's `CI passed` judges their records"
        value: ${{ jobs.lint.outputs.ui }}
      vitest-affected:
        description: "'true' when Test (Linux) ran the Vitest run in its five shards and uploaded its blobs, which ci.yml's aggregate merges"
        value: ${{ jobs.lint.outputs.ui }}
    inputs:
      full:
        description: >-
          true runs every job. false is the light tier of a draft pull request (ci.yml): the Playwright suites (the visual and
          atlas steps of Test (Linux)) and Build (Windows) are skipped and the rest runs. Only ci.yml's `CI passed` may sum up a full run; a light run reports as
          `CI light passed`.
        type: boolean
        default: true
permissions: { contents: read }
# Every job runs its Nx targets through .github/actions/nx-run: on a pull request only the projects
# the change affects (see each project's project.json and `implicitDependencies`), otherwise all of
# them. The Playwright jobs keep their own `run:` steps (they pass a shard) and use .github/actions/nx-affected to
# decide whether to run. docs/operations/ci-and-releases.md lists the jobs as GitHub shows them; ci.yml's `CI passed`
# job is the one check that sums them up (no ruleset requires any check yet, #544). Checkouts fetch full history so Nx
# can diff against the base branch.
#
# The shape trades job slots against the critical path (docs/research/2026-11-06-ci-job-grouping.md, #3065): a pull request
# should hold about 10 runners at once so two can run side by side. The visual suite is most of a UI pull request's wait, so it is
# sharded and sets the critical path; every other check shares a runner with checks that need the same toolchain, one check per
# step with `if: ${{ !cancelled() }}` so a red step hides none after it, and a summary step (scripts/ci/step-summary.mjs) that
# reports each. scripts/ci/check-manifest.json records which job and step runs each check.
jobs:
  lint:
    # Runs first; every other job waits for it, so a lint finding stops the run before the long jobs start (owner decision, #3065).
    # Two parts:
    #   - Scope: which job families the change reaches, so the others are skipped (no runner, no toolchain setup) instead of starting,
    #     installing and finding nothing to do. Same rule as every nx-run / nx-affected step (scripts/ci/nx-scope.sh: everything on a
    #     manual run or a workspace-wide file, else `nx show projects --affected`).
    #       - ui: Test (Linux)'s Vitest, visual and atlas steps, in all five shards (`test-shards`); otherwise shard 1 alone runs.
    #       - shell: Test (Windows) (the Go tests and lint, and the Lua harness on Windows), so the reaper project or the shell.
    #     A skipped job counts as passed in ci.yml's `CI passed`; the steps inside those jobs keep their own scope check.
    #     A pull request whose workflow changes are only `uses:` pin bumps (Dependabot) is not `all` here: the nx-affected steps run
    #     nx-scope.sh --pins, and the `pins` step (scripts/ci/workflow-pins.mjs, pin-flags.mjs) ORs in the families of the jobs that
    #     contain a changed pin (a changed local action: every job that uses it). On a pure pin bump the lint steps run only when this job
    #     is reached (`static`) and the quick test steps of Test (Linux) only when that job is (`quickubuntu`). Any other change under
    #     .github/workflows or .github/actions (a `run:`, `if:`, `with:` or `needs:` line, a step, job or file added or removed) is `all`.
    #   - Lint, one step per project family, each on its affected projects: ui static and web static (lint, format, architecture and
    #     node:test of the UI and site projects, the site's typecheck and Vitest run), Knip (every workspace, so `always`), python lint
    #     (ruff and the typecheck of the Python projects), reaper lint (StyLua and ruff on the bridge), docs-site lint (`always`).
    #     Go lint runs in Test (Windows) (it needs the Windows build tags). Then the test ratchet (advisory, pull requests only).
    name: lint
    timeout-minutes: 20
    runs-on: ubuntu-latest
    outputs:
      ui: ${{ steps.ui.outputs.affected == 'true' || steps.pins.outputs.ui == 'true' }}
      shell: ${{ steps.shell.outputs.affected == 'true' || steps.pins.outputs.shell == 'true' }}
      static: ${{ steps.pins.outputs.static }}
      quickubuntu: ${{ steps.pins.outputs.quickubuntu }}
      # Test (Linux)'s shards: all five when the UI is affected, else shard 1 alone (its quick tests).
      test-shards: ${{ (steps.ui.outputs.affected == 'true' || steps.pins.outputs.ui == 'true') && '[1,2,3,4,5]' || '[1]' }}
      ui-dist: ${{ steps.ui-dist.outcome == 'success' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0, persist-credentials: false }
      - uses: ./.github/actions/setup-toolchain
        with:
          need-go: 'false'
          need-wails-tools: 'false'
          need-linux-native-deps: 'false'
          python-sync-args: --group docs
      - id: ui
        uses: ./.github/actions/nx-affected
        with:
          projects: ui
          pins: 'true'
      - id: shell
        uses: ./.github/actions/nx-affected
        with:
          projects: reaper,desktop
          pins: 'true'
      # Only a pull request can be a pin bump; elsewhere the classifier is skipped and the self-scoped jobs start.
      - id: pins
        env:
          BASE_REF: ${{ github.base_ref }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "pull_request" ]; then
            node scripts/ci/workflow-pins.mjs "origin/$BASE_REF" | tee "$RUNNER_TEMP/pins.json"
          else
            echo '{"kind":"none"}' > "$RUNNER_TEMP/pins.json"
          fi
          node scripts/ci/pin-flags.mjs --github-output < "$RUNNER_TEMP/pins.json"

      # The UI bundle Build (Windows) packages (full tier): built here on Linux and uploaded as `ui-dist`, so the Windows build starts with
      # the other jobs once lint has passed. It cannot be built on the Windows runner: tsc there resolves `./PageBreaks` and `./pageBreaks`
      # (and `./EntryTable` and `./entryTable`) to one file on the case-insensitive file system and fails. First, so a red lint step below
      # cannot hold it back; its `tsc --noEmit` is the UI's typecheck.
      - name: UI bundle
        id: ui-bundle
        if: inputs.full
        run: pnpm --dir src/studio/ui run build
      - id: ui-dist
        if: inputs.full
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ui-dist
          path: src/studio/ui/dist
          if-no-files-found: error
          retention-days: 1
      - name: ui static
        id: ui-static
        if: ${{ !cancelled() && steps.pins.outputs.static == 'true' }}
        uses: ./.github/actions/nx-run
        with:
          targets: lint format architecture test-node
          projects: ui
      - name: web static
        id: web-static
        if: ${{ !cancelled() && steps.pins.outputs.static == 'true' }}
        uses: ./.github/actions/nx-run
        with:
          targets: lint format architecture typecheck test-node test
          projects: web
      - name: knip
        id: knip
        if: ${{ !cancelled() && steps.pins.outputs.static == 'true' }}
        uses: ./.github/actions/nx-run
        with:
          targets: knip
          projects: workspace
          always: 'true'
      - name: python lint
        id: python-lint
        if: ${{ !cancelled() && steps.pins.outputs.static == 'true' }}
        uses: ./.github/actions/nx-run
        with:
          targets: lint typecheck
          projects: tag:toolchain:python,fixtures
      - name: reaper lint
        id: reaper-lint
        if: ${{ !cancelled() && steps.pins.outputs.static == 'true' }}
        uses: ./.github/actions/nx-run
        with:
          targets: lint
          projects: reaper
      - name: docs-site lint
        id: docs-site-lint
        if: ${{ !cancelled() && steps.pins.outputs.static == 'true' }}
        uses: ./.github/actions/nx-run
        with:
          targets: lint
          projects: docs-site
          always: 'true'
      # Tests only ratchet up (scripts/ci/test-ratchet.mjs): a pull request should not delete a test file, add a skip or focus marker to
      # one, or lower a coverage floor. Advisory: it prints every violation and raises a warning annotation, and never fails, so nobody
      # has to approve a deliberate change; the coordinator and reviewers read the warning. It runs the script as it is on the base
      # branch, so a pull request cannot edit its own check; a pull request that adds the script runs its own copy, once.
      - name: test ratchet
        id: test-ratchet
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          script="$RUNNER_TEMP/test-ratchet.mjs"
          git show "$BASE_SHA:scripts/ci/test-ratchet.mjs" > "$script" 2>/dev/null || cp scripts/ci/test-ratchet.mjs "$script"
          if node "$script" "$BASE_SHA"; then exit 0; fi
          echo "::warning title=Test ratchet::This change weakens a test or lowers a coverage floor (listed above). Say in the pull request why it is intended."
          exit 0
      - name: Summary
        if: always()
        env:
          OUTCOMES: >-
            {"UI bundle": "${{ steps.ui-bundle.outcome }}", "ui static": "${{ steps.ui-static.outcome }}", "web static": "${{ steps.web-static.outcome }}",
            "knip": "${{ steps.knip.outcome }}", "python lint": "${{ steps.python-lint.outcome }}",
            "reaper lint": "${{ steps.reaper-lint.outcome }}", "docs-site lint": "${{ steps.docs-site-lint.outcome }}",
            "test ratchet": "${{ steps.test-ratchet.outcome }}"}
        run: node scripts/ci/step-summary.mjs
  test-linux:
    # Every Linux test, in five shards (owner decision, #3065: 11 checks on free runners, each shard well under the 30-minute limit).
    #   - Shard 1 also runs the quick tests (`quickubuntu`): repo-scripts (the plain-Node scripts; `always`: the layout and project guards
    #     read every tracked file), docs-site (its unit tests; `always`: docs/ belongs to no project), python (pytest of the Python projects;
    #     Go is installed for the transcript-compare tests), reaper (Lua) (the bridge harness under Lua 5.4: on a pull request its
    #     characterization tests, the `pr` configuration; on every other run with its mutation checks too) and the rename rehearsal (renames a
    #     throwaway worktree of this commit to a made-up name and runs the brand sync, both name guards and the tests that read the name,
    #     scripts/brand/rehearse-rename.mjs; main-health runs `--full`, which adds the UI typecheck and the built site, #3078).
    #   - Every shard, when the UI is affected, runs a fifth of:
    #       - Vitest (`vitest --shard=i/5`, split by cost, src/studio/ui/scripts/vitest-shards.mjs). A shard checks no coverage floor; it
    #         uploads a blob of its results and coverage, and ci.yml's `CI passed` (.github/actions/ci-gate) merges the five and checks the
    #         floors of scripts/ci/coverage-floors.json over the whole run. No Nx cache and no retry.
    #       - the visual suite (full tier): every {page, state, viewport} of the mock-backed app, failing on errors, sideways overflow and
    #         collapsed controls per capture (src/studio/ui/tests/visual/lib/capture.ts). Split by measured time (scripts/ci/visual-shards.mjs
    #         and src/studio/ui/tests/visual/shard-weights.json); shard 1's share is smaller by the time its quick tests take
    #         (`--reserve-first`). The checks that need the whole run (blank, undeclared duplicate, stale sameAs, and that the shards held
    #         every test) run in `CI passed` from each shard's capture records and manifest. `aria` (the role trees, about 50 s) runs on the
    #         shard the split names.
    #       - the component atlas (full tier): every Storybook story x light/dark x wide/narrow, with play() interactions, axe and overflow
    #         checks (`pnpm atlas --shard=i/5`); shard 1 also checks docs/ui equals a fresh generation (fix with
    #         `pnpm --dir src/studio/ui docs:atlas`).
    #     A change that does not reach the UI runs shard 1 alone (lint's `test-shards`), so only its quick tests run.
    # Each step runs even after a red one (`!cancelled()`), and the summary names every step's result.
    # 30 min: run 42387889311 measured about 101 min of this work in total (Vitest 15.5, atlas 16.9, visual 64.2, quick tests 4.4); a fifth
    # is about 20 min plus about 1.5 of setup, which leaves room for a slow `setup-playwright` (up to 11 min seen once).
    name: Test (Linux ${{ matrix.shard }}/5)
    needs: lint
    timeout-minutes: 30
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.lint.outputs.test-shards) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0, persist-credentials: false }
      # Go and Python only on shard 1, which runs the quick tests. No GTK 4 or WebKitGTK: the rename rehearsal, `--full` included, runs
      # `go vet` and the brand tests, which need neither.
      - uses: ./.github/actions/setup-toolchain
        with:
          need-go: ${{ matrix.shard == 1 }}
          need-python: ${{ matrix.shard == 1 }}
          need-stylua: 'false'
          need-wails-tools: 'false'
          need-linux-native-deps: 'false'
          python-sync-args: --group docs
      - id: scope
        uses: ./.github/actions/nx-affected
        with:
          projects: ui
      - name: repo-scripts
        id: repo-scripts
        if: ${{ !cancelled() && matrix.shard == 1 && needs.lint.outputs.quickubuntu == 'true' }}
        uses: ./.github/actions/nx-run
        with:
          targets: test-node
          projects: repo-scripts
          always: 'true'
      - name: docs-site
        id: docs-site
        if: ${{ !cancelled() && matrix.shard == 1 && needs.lint.outputs.quickubuntu == 'true' }}
        uses: ./.github/actions/nx-run
        with:
          targets: test
          projects: docs-site
          always: 'true'
      - name: python
        id: python
        if: ${{ !cancelled() && matrix.shard == 1 && needs.lint.outputs.quickubuntu == 'true' }}
        uses: ./.github/actions/nx-run
        with:
          targets: test
          projects: tag:toolchain:python,fixtures
      - name: reaper (Lua)
        id: reaper
        if: ${{ !cancelled() && matrix.shard == 1 && needs.lint.outputs.quickubuntu == 'true' }}
        uses: ./.github/actions/nx-run
        with:
          targets: test
          projects: reaper
          configuration: ${{ github.event_name == 'pull_request' && 'pr' || '' }}
      - name: rename rehearsal
        id: rename
        if: ${{ !cancelled() && matrix.shard == 1 }}
        env:
          FULL: ${{ github.event_name != 'pull_request' && '--full' || '' }}
        run: node scripts/brand/rehearse-rename.mjs $FULL
      - name: vitest
        id: vitest
        if: ${{ !cancelled() && steps.scope.outputs.affected == 'true' }}
        env:
          SHARD: ${{ matrix.shard }}
        run: node scripts/ci/coverage-gate.mjs vitest src/studio/ui --shard="$SHARD/5"
      # `.cache` is a hidden directory, which upload-artifact leaves out unless told.
      - if: ${{ !cancelled() && steps.scope.outputs.affected == 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vitest-blob-${{ matrix.shard }}
          path: .cache/coverage/vitest-src-studio-ui-blobs
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1
      - if: ${{ !cancelled() && inputs.full && steps.scope.outputs.affected == 'true' }}
        uses: ./.github/actions/setup-playwright
      # Lists the suite (no browser), gives this shard its tests and says whether this shard also runs `aria`. Fails if the shards do not
      # hold every test exactly once. Shard 1 carries the quick tests: about 5 min on a pull request, about 8 with the mutation checks and
      # the `--full` rehearsal elsewhere.
      - id: split
        if: ${{ !cancelled() && inputs.full && steps.scope.outputs.affected == 'true' }}
        env:
          SHARD: ${{ matrix.shard }}
          RESERVE: ${{ github.event_name == 'pull_request' && '300' || '480' }}
        run: node scripts/ci/visual-shards.mjs split --shard "$SHARD/5" --reserve-first "$RESERVE" --out "$RUNNER_TEMP/shard.txt" --manifest "$RUNNER_TEMP/shard-$SHARD.json" --github-output
      # The JSON report is the profile (time per test); a shard uploads it as ui-visual-timings-<i> and `visual-shards.mjs weights` rebuilds
      # shard-weights.json from them.
      - name: visual
        id: visual
        if: ${{ !cancelled() && steps.split.outcome == 'success' }}
        env:
          UI_VISUAL_SHARDED: '1'
          PLAYWRIGHT_JSON_OUTPUT_NAME: ${{ runner.temp }}/timings.json
        run: pnpm --dir src/studio/ui run screenshots --test-list "$RUNNER_TEMP/shard.txt" --reporter=list,json
      - name: aria
        id: aria
        if: ${{ !cancelled() && steps.split.outputs.aria == 'true' }}
        run: pnpm --dir src/studio/ui run aria
      # The manifest goes in the records directory, so it is uploaded with them. `mkdir`: a shard that failed before its first test has none.
      - if: ${{ !cancelled() && steps.split.outcome == 'success' }}
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          mkdir -p src/studio/ui/screenshots/.run
          cp "$RUNNER_TEMP/shard-$SHARD.json" src/studio/ui/screenshots/.run/
      # `.run` is a hidden directory, which upload-artifact leaves out unless told. A shard that drew only the overlay guard's tests
      # (they capture no screenshots, so write no records) still uploads its manifest.
      - if: ${{ !cancelled() && steps.split.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ui-visual-records-${{ matrix.shard }}
          path: src/studio/ui/screenshots/.run
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1
      - if: ${{ !cancelled() && steps.split.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ui-visual-timings-${{ matrix.shard }}
          path: ${{ runner.temp }}/timings.json
          if-no-files-found: ignore
          retention-days: 14
      - name: atlas
        id: atlas
        if: ${{ !cancelled() && inputs.full && steps.scope.outputs.affected == 'true' }}
        env:
          SHARD: ${{ matrix.shard }}
        run: pnpm --dir src/studio/ui run atlas --shard="$SHARD/5"
      - name: atlas docs
        id: atlas-docs
        if: ${{ !cancelled() && inputs.full && steps.scope.outputs.affected == 'true' && matrix.shard == 1 }}
        run: pnpm exec nx run ui:atlas-docs --skip-nx-cache
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: ui-visual-screenshots-${{ matrix.shard }}
          path: src/studio/ui/screenshots/app
          if-no-files-found: ignore
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: ui-atlas-screenshots-${{ matrix.shard }}
          path: src/studio/ui/screenshots/atlas
          if-no-files-found: ignore
          retention-days: 7
      # Playwright keeps a trace only for a failing test (`trace: 'retain-on-failure'`), so a green run has nothing to upload and a red one
      # ships a trace.zip per failing test. Open it with `playwright show-trace`.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: ui-visual-traces-${{ matrix.shard }}
          path: src/studio/ui/test-results
          if-no-files-found: ignore
          retention-days: 3
      - name: Summary
        if: always()
        env:
          OUTCOMES: >-
            {"repo-scripts": "${{ steps.repo-scripts.outcome }}", "docs-site": "${{ steps.docs-site.outcome }}",
            "python": "${{ steps.python.outcome }}", "reaper (Lua)": "${{ steps.reaper.outcome }}",
            "rename rehearsal": "${{ steps.rename.outcome }}", "vitest": "${{ steps.vitest.outcome }}",
            "visual": "${{ steps.visual.outcome }}", "aria": "${{ steps.aria.outcome }}",
            "atlas": "${{ steps.atlas.outcome }}", "atlas docs": "${{ steps.atlas-docs.outcome }}"}
        run: node scripts/ci/step-summary.mjs

  test-windows:
    # Every Windows check in one job (owner decision, #3065). These were two jobs, go-test (root) and go-test (rest), each paying for
    # its own Windows runner and toolchain setup.
    #   - go test: every Go package in one `go test` (the `ci` configuration of the test target): the race detector on the packages with
    #     concurrency, the module's root package among them, the rest without (scripts/ci/coverage-gate.mjs). `go test` runs the packages
    #     side by side, so the root package (405 s with the race detector on run 39138316593, most of the cost) runs beside the others
    #     instead of on a runner of its own. Then every Go coverage floor is checked.
    #   - go test-schedules: the teleprompter and shutdown tests on one and on four CPUs (an ordering bug between goroutines that hides on
    #     the default scheduler fails there on demand).
    #   - go lint: gofmt, go vet, golangci-lint and checklocks (the `ci` configuration of the lint target), here because it needs the
    #     Windows build tags.
    #   - reaper (Lua): the bridge harness under Lua 5.4 on Windows, because the bridge builds paths from package.config and REAPER's own
    #     Lua writes CRLF. A pull request runs its `pr` configuration (the characterization tests, about a minute) here and in
    #     Test (Linux); every other run (main-health, a manual run) and post-merge.yml run the mutation checks on both.
    # Each step runs even after a red one (`!cancelled()`), and the summary names every step's result. Windows is the only supported
    # platform and Linux's native libraries are not installed on the Linux runners, so Go is tested and linted here.
    # 40 min: on run 42397023062 the two jobs took 10.3 (root, with lint) and 14.6 min (rest, with the harness); a main-health run's
    # mutation checks add up to 15.
    needs: lint
    if: needs.lint.outputs.shell == 'true'
    name: Test (Windows)
    timeout-minutes: 40
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0, persist-credentials: false }
      # No Python for the Go steps: Go tests that need the real sidecars skip themselves when the checkout has no `.venv`, and a
      # half-synced one (the Lua group only) would make them run and fail. The Lua harness's Python comes after them.
      - uses: ./.github/actions/setup-toolchain
        with:
          need-python: 'false'
          need-wails-tools: 'false'
          need-stylua: 'false'
          need-golangci-lint: 'true'
          pnpm-filter: workspace
      - name: go test
        id: go-test
        uses: ./.github/actions/nx-run
        with:
          targets: test
          projects: desktop
          configuration: ci
      - name: go test-schedules
        id: schedules
        if: ${{ !cancelled() }}
        uses: ./.github/actions/nx-run
        with:
          targets: test-schedules
          projects: desktop
      - name: go lint
        id: go-lint
        if: ${{ !cancelled() }}
        uses: ./.github/actions/nx-run
        with:
          targets: lint
          projects: desktop
          configuration: ci
      - name: Python and StyLua for the Lua harness
        if: ${{ !cancelled() }}
        uses: ./.github/actions/setup-toolchain
        with:
          need-node: 'false'
          need-pnpm: 'false'
          need-go: 'false'
          need-wails-tools: 'false'
          python-sync-args: --only-group lua
      - name: reaper (Lua)
        id: reaper
        if: ${{ !cancelled() }}
        uses: ./.github/actions/nx-run
        with:
          targets: lint test
          projects: reaper
          configuration: ${{ github.event_name == 'pull_request' && 'pr' || '' }}
      - name: Summary
        if: always()
        shell: bash
        env:
          OUTCOMES: >-
            {"go test": "${{ steps.go-test.outcome }}", "go test-schedules": "${{ steps.schedules.outcome }}",
            "go lint": "${{ steps.go-lint.outcome }}", "reaper (Lua)": "${{ steps.reaper.outcome }}"}
        run: node scripts/ci/step-summary.mjs

  # Windows is the only supported platform, so it is the only native build.
  build-windows:
    # The whole app from lint's `ui-dist` bundle: the Wails build, the setup program and the notices (build-native). It starts with the
    # other jobs once lint has passed.
    name: Build (Windows)
    needs: lint
    if: ${{ inputs.full && needs.lint.outputs.ui-dist == 'true' }}
    timeout-minutes: 30
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/build-native
        with:
          platform: windows-x64
      # The packaged program, setup program, notices and checksums of this pull request, for a by-hand launch on Windows (the owner's
      # check of a shell change, for example the Wails v3 migration). Never a release: releases are built by prerelease.yml.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: app-windows-x64
          path: release-assets/
          if-no-files-found: error
          retention-days: 7
