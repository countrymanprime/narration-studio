name: CodeQL
# Advisory: not a required status check. Results appear under Security > Code scanning.
# Runs nightly on main and when started by hand, never on a pull request or a push: the nightly run of all three languages is the
# baseline in the Security tab, and an alert appears there the morning after the code that raised it merges.
on:
  schedule:
    - cron: '23 5 * * *'
  workflow_dispatch: {}
permissions: { contents: read }
concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  # Never cancel a run on main: it is the baseline shown in the Security tab.
  cancel-in-progress: false
jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    timeout-minutes: 30
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - { language: go, build-mode: manual }
          - { language: javascript-typescript, build-mode: none }
          - { language: python, build-mode: none }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: matrix.language == 'go'
        uses: ./.github/actions/setup-toolchain
        with:
          need-node: 'false'
          need-pnpm: 'false'
          need-python: 'false'
          need-wails-tools: 'false'
          need-stylua: 'false'
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
      # Two things CodeQL's Go tracer needs: -a, because setup-go restores the build cache and only
      # recompiled code is seen, and `go build` run from the module directory rather than
      # `go -C src/studio/desktop build`, whose leading flag stops the tracer recognising the build.
      - if: matrix.language == 'go'
        working-directory: src/studio/desktop
        run: go build -a ./...
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: /language:${{ matrix.language }}
