name: Security scan
# Advisory: neither scanner is a required check, and neither fails the run on a finding (no ruleset requires a status
# check, and the first month is a baseline: docs/operations/ci-and-releases.md, "Vulnerability scanning"). Findings show under
# Security > Code scanning and in the run log.
#   - govulncheck (this file): Go vulnerabilities that the code can actually reach (the Go module in src/studio/desktop).
#   - OSV-Scanner (osv-scanner.yml): every known advisory in the three lockfiles (Go, npm, Python).
# A pull request runs govulncheck when it changes the Go module, its toolchain pin or this workflow. The baseline on main
# is the nightly run, not a push: a new advisory can land against an unchanged module, so the nightly run is what catches it.
on:
  pull_request:
    paths:
      - 'src/studio/desktop/**'
      - 'scripts/toolchain.json'
      - 'scripts/ci/dedupe-sarif-stacks.mjs'
      - '.github/actions/setup-toolchain/**'
      - '.github/workflows/security.yml'
  schedule:
    - cron: '41 6 * * *'
  workflow_dispatch: {}
permissions: { contents: read }
concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  # Never cancel a run on main: it is the baseline shown in the Security tab.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  govulncheck:
    name: govulncheck
    timeout-minutes: 15
    # Windows, like the `go` quality job: it is the supported platform and Linux's native libraries are not installed on
    # pull requests. The module builds without cgo, so no native library is needed to type-check it.
    runs-on: windows-latest
    permissions:
      contents: read
      security-events: write # to upload the SARIF results
    defaults:
      run:
        shell: bash
    env:
      # A fork or Dependabot pull request gets a read-only token, so the upload below would fail: scan, but do not upload.
      CAN_UPLOAD: ${{ github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-toolchain
        with:
          need-node: 'false'
          need-pnpm: 'false'
          need-python: 'false'
          need-wails-tools: 'false'
          need-stylua: 'false'
      # Installed from the Go module proxy at the version scripts/toolchain.json pins (keep them in step), rather than
      # through the golang/govulncheck-action wrapper, which installs `@latest`.
      - name: Install the pinned govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.8.0
      # SARIF output never fails the run; the text run below prints the findings for the log.
      - name: Scan the Go module (SARIF)
        run: govulncheck -C src/studio/desktop -format sarif ./... > govulncheck.sarif
      # govulncheck v1.8.0 repeats identical entries in a result's `stacks`, which SARIF forbids, so Code scanning rejects
      # the file. Only exact duplicates are dropped; every finding stays.
      - name: Drop duplicate stacks from the SARIF
        run: node scripts/ci/dedupe-sarif-stacks.mjs govulncheck.sarif
      - name: Upload the results to Code scanning
        if: env.CAN_UPLOAD == 'true'
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          sarif_file: govulncheck.sarif
          category: govulncheck
      # `!cancelled()`: the findings must reach the log even when the upload above fails.
      - name: Print the findings
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: govulncheck -C src/studio/desktop ./...
