name: Storage spike (Windows)
# Manual only. Runs the throwaway storage benchmark in apps/desktop/cmd/spike-storage on a Windows runner and uploads its
# numbers (docs/research/storage-engine-spike.md). It is not part of the gate and nothing depends on it.
on:
  workflow_dispatch:
    inputs:
      scale:
        description: Dataset size (tiny, full, max or stress)
        type: choice
        options: [full, max, stress, tiny]
        default: full
permissions: { contents: read }
jobs:
  spike:
    name: Storage spike, Windows
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      CGO_ENABLED: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.2'
          cache: false
      - name: Build
        working-directory: apps/desktop/cmd/spike-storage
        run: go build -o "$env:RUNNER_TEMP\spike.exe" .
      - name: Run
        env:
          SCALE: ${{ inputs.scale }}
        run: |
          New-Item -ItemType Directory -Force "$env:RUNNER_TEMP\project" | Out-Null
          & "$env:RUNNER_TEMP\spike.exe" all -dir "$env:RUNNER_TEMP\project" -scale $env:SCALE -out "$env:RUNNER_TEMP\results-windows.json" | Tee-Object -FilePath "$env:RUNNER_TEMP\results-windows.md"
      - name: Driver features
        run: |
          New-Item -ItemType Directory -Force "$env:RUNNER_TEMP\info" | Out-Null
          & "$env:RUNNER_TEMP\spike.exe" info -dir "$env:RUNNER_TEMP\info"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: storage-spike-windows-${{ inputs.scale }}
          path: |
            ${{ runner.temp }}/results-windows.json
            ${{ runner.temp }}/results-windows.md
