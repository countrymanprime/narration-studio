version: 2
updates:
  # One npm entry covers the pnpm workspace, including apps/ui. A second entry for /apps/ui opened duplicate pull
  # requests that changed only apps/ui/package.json and failed the frozen-lockfile install, because Dependabot
  # cannot update the workspace lockfile from a member directory.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # Wait a week before proposing a release; security updates ignore the cooldown. pnpm itself refuses versions under 3 days (pnpm-workspace.yaml).
    cooldown:
      default-days: 7
    groups:
      tooling:
        update-types: [minor, patch]
    ignore:
      # apps/ui/package.json keeps `typescript` on the 6.x line (an alias of `@typescript/typescript6`), which
      # typescript-eslint accepts, so Dependabot may propose 6.x updates. TypeScript 7 ships no JS API that
      # typescript-eslint can use, so it is installed beside it as `@typescript/native` (an alias of `typescript@7`)
      # and a 7.x proposal for `typescript` itself stays ignored.
      - dependency-name: typescript
        versions: [">=7.0.0"]
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    # Three days, the length of Dependabot's own default; uv.lock pins hashes. Security updates ignore the cooldown.
    cooldown:
      default-days: 3
    groups:
      python-dependencies:
        update-types: [minor, patch]
  - package-ecosystem: gomod
    directory: /apps/desktop
    schedule:
      interval: weekly
    # Three days, as for uv; go.sum and the checksum database pin every module. Security updates ignore the cooldown.
    cooldown:
      default-days: 3
    groups:
      go-dependencies:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # A pinned action SHA is only as safe as the tag it came from, so wait a week before proposing a new one; security updates ignore the cooldown.
    cooldown:
      default-days: 7
    groups:
      github-actions:
        update-types: [minor, patch]
