# The page behind a modal is aria-hidden, so <body> holds the alert dialog and the two empty toast live regions, nothing else.
- /children: equal
# The two toast live regions stay in the tree on purpose: Base UI leaves live regions exposed behind a modal, so an error raised
# from inside a dialog is still announced. They are empty here, and the page's pair is portalled to <body> (Toast.tsx), so it sits beside the overlay host's, not under <main>.
- main:
  - group "Zoom"
- status
- alert
- status
- alert
- status
- alertdialog "Import Alice.docx":
  - heading "Import Alice.docx" [level=2]
  - button "Close"
  - paragraph: /DOCX · \d+ paragraphs.*This replaces the active manuscript and clears Story Bible/
  - button "Cancel"
  - button "Replace and reset"
