# Choosing a read from another item in the Takes panel: the read is added as a
# new take and made active, two undo steps, so it asks first. The page behind the confirm is aria-hidden, so <body> holds the
# alert dialog and what Base UI leaves exposed on purpose (the zoom group, the two empty toast live regions).
- /children: equal
- main:
  - group "Zoom"
  - alert
  - status
# The overlay host's own live regions (the toast pair and the announcer) stay exposed behind a modal for the same reason.
- alert
- status
- status
- alertdialog "Add this read and make it active":
  - heading "Add this read and make it active" [level=2]
  - button "Close"
  - paragraph: /REAPER will add this read .* as a new take on the item, then make it the active take/
  - button "Cancel"
  - button "Add and make active"
