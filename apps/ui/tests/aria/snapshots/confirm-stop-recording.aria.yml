# Leaving the Booth during a take: the page behind the confirm is aria-hidden, so <body> holds the alert dialog and what
# Base UI leaves exposed on purpose - the live regions inside the page's main, so the footer's status is still announced.
- /children: equal
- main:
  - alert
  - status
# The overlay host's own live regions (the toast pair and the announcer) stay exposed behind a modal for the same reason.
- alert
- status
- status
- alertdialog "Stop recording?":
  - heading "Stop recording?" [level=2]
  - button "Close"
  - paragraph: /is recording\. Leaving the Booth stops it/
  - button "Keep recording"
  - button "Stop and leave"
