# The jump menu (ADR 0780 decision 6), opened from the header: a modal dialog holding one combobox field that names the active option and
# a listbox. Opened with nothing typed it lists one row per command group, the first selected. The live regions behind it are the page's and the overlay host's.
- main:
  - group "Zoom"
  - alert
  - status
- alert
- status
- status
- dialog "Jump menu":
  - heading "Jump menu" [level=2]
  - button "Close"
  - combobox "Jump menu" [expanded]
  - listbox "Jump menu results":
    - option /Go to \d+ commands/ [selected]
    - option "Zoom 3 commands"
    - option "View 2 commands"
    - option /Chapters \d+ commands/
