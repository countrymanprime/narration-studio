# Below md the navigation is a modal drawer: a named dialog, the only thing in <body> besides the two empty toast live regions, holding the same list as the sidebar.
- /children: equal
# The two toast live regions stay in the tree on purpose: Base UI leaves live regions exposed behind a modal, so an error raised
# from inside a dialog is still announced. They are empty here, and the page's pair is portalled to <body> (Toast.tsx), so it sits beside the overlay host's, not under <main>.
- main:
  - group "Zoom"
- status
- alert
- status
- alert
- status
- dialog "Navigation":
  - heading "Navigation" [level=2]
  - button "Close navigation"
  - navigation:
    - /children: equal
    - group "Production":
      - /children: equal
      - button "Production"
      - button "Schedule"
    - group "Prep":
      - /children: equal
      - text: Prep
      - button "Script"
      - button "Story Bible"
    - group "Record":
      - /children: equal
      - text: Record
      - button "Booth"
    - group "Edit":
      - /children: equal
      - text: Edit
      - button "Editing"
    - group "Review":
      - /children: equal
      - text: Review
      - button /Proof, \d+/
      - button /Pickups, \d+/
    - group "Finish":
      - /children: equal
      - text: Finish
      - button "Master & QC"
      - button "Delivery"
  - button "Settings"
